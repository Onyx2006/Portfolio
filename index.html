// If that early call were allowed to construct the AudioContext, the
// context would be born outside a real user gesture, and on strict mobile
// browsers (iOS Safari, in-app webviews) it can then get stuck "suspended"
// forever — resume() from later, genuine taps stops actually unlocking it.
// Only unlockAudio() (called from the "Press Start" tap) is allowed to
// construct it, so its whole lifecycle starts inside a trusted gesture.
function getAudioContext({ allowCreate = false } = {}) {
  if (!sharedAudioCtx) {
    if (!allowCreate) return null;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    sharedAudioCtx = new AC();
  }
  return sharedAudioCtx;
}
async function unlockAudio() {
  const ctx = getAudioContext({ allowCreate: true });
  if (!ctx) return null;
  if (ctx.state === "suspended") {
    try { await ctx.resume(); } catch (e) { /* ignore */ }
  }
  // Belt-and-braces mobile unlock: resume() alone isn't always enough on
  // iOS Safari / in-app browsers (Instagram, TikTok, etc). Actually
  // starting a real (silent) buffer source, synchronously inside this same
  // tap, is the trick that reliably wakes the whole audio pipeline up on
  // those stricter engines.
  try {
    const buffer = ctx.createBuffer(1, 1, 22050);
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    src.connect(ctx.destination);
    src.start(0);
  } catch (e) { /* ignore */ }
  audioUnlocked = ctx.state === "running";
  return ctx;
}

/* ALGO::DASHBOARD LIVE PREVIEWS
   Real, running miniatures of each algorithm from the project — not static
   icons. Each "engine" is a small closure: engine(canvas, ctx) sets up its
   own state and returns { step() } where step() draws one frame and
   returns true once that run has reached a natural end (solved maze,
   sorted array, dead snake, stable/extinct board, max zoom). AlgoPreview
   below drives the loop and, on true, freezes the last frame for 3s before
   instantiating a fresh engine — so every card is always doing something.
   Boids and Voronoi never "finish"; they just keep drifting. */

function pathfindingEngine(canvas, ctx) {
  const COLS = 14, ROWS = 10, CELL = canvas.width / COLS;
  const grid = [];
  for (let y = 0; y < ROWS; y++) {
    const row = [];
    for (let x = 0; x < COLS; x++) row.push({ x, y, wall: Math.random() < 0.24, visited: false, parent: null, g: Infinity, f: Infinity });
    grid.push(row);
  }
  const start = { x: 0, y: Math.floor(ROWS / 2) };
  const end = { x: COLS - 1, y: Math.floor(ROWS / 2) };
  grid[start.y][start.x].wall = false;
  grid[end.y][end.x].wall = false;
  grid[start.y][start.x].g = 0;
  grid[start.y][start.x].f = Math.abs(start.x - end.x) + Math.abs(start.y - end.y);
  const open = [grid[start.y][start.x]];
  let path = null, finished = false;

  const neighbors = (n) => {
    const out = [];
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = n.x + dx, ny = n.y + dy;
      if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS && !grid[ny][nx].wall) out.push(grid[ny][nx]);
    }
    return out;
  };
  const manhattan = (a, b) => Math.abs(a.x - b.x) + Math.abs(a.y - b.y);
  const reconstruct = (n) => { const p = []; let c = n; while (c) { p.push(c); c = c.parent; } return p.reverse(); };

  function draw(current) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      const node = grid[y][x];
      ctx.fillStyle = node.wall ? "#3a4456" : node.visited ? "#1c3a54" : "#0d131c";
      ctx.fillRect(x * CELL, y * CELL, CELL - 1, CELL - 1);
    }
    if (current) { ctx.fillStyle = "#ffb454"; ctx.fillRect(current.x * CELL, current.y * CELL, CELL - 1, CELL - 1); }
    if (path) { ctx.fillStyle = "#39ff9c"; for (const n of path) ctx.fillRect(n.x * CELL, n.y * CELL, CELL - 1, CELL - 1); }
    ctx.fillStyle = "#39ff9c"; ctx.fillRect(start.x * CELL, start.y * CELL, CELL - 2, CELL - 2);
    ctx.fillStyle = "#ff5c7a"; ctx.fillRect(end.x * CELL, end.y * CELL, CELL - 2, CELL - 2);
  }

  return {
    step() {
      if (finished) return true;
      let current;
      for (let i = 0; i < 3 && open.length > 0 && !finished; i++) {
        let minI = 0;
        for (let j = 1; j < open.length; j++) if (open[j].f < open[minI].f) minI = j;
        current = open.splice(minI, 1)[0];
        if (current.visited) { i--; continue; }
        current.visited = true;
        if (current === grid[end.y][end.x]) { path = reconstruct(current); finished = true; break; }
        for (const nb of neighbors(current)) {
          if (nb.visited) continue;
          const tg = current.g + 1;
          if (tg < nb.g) { nb.g = tg; nb.f = tg + manhattan(nb, end); nb.parent = current; open.push(nb); }
        }
      }
      if (open.length === 0 && !finished) finished = true;
      draw(finished ? null : current);
      return finished;
    },
  };
}

function neuroSnakeEngine(canvas, ctx) {
  const COLS = 18, ROWS = 13, CELL = canvas.width / COLS;
  let snake = [{ x: 4, y: 6 }, { x: 3, y: 6 }, { x: 2, y: 6 }];
  let dir = { x: 1, y: 0 }, dead = false, steps = 0, tick = 0;

  const spawnFood = () => {
    let p;
    do { p = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) }; }
    while (snake.some((s) => s.x === p.x && s.y === p.y));
    return p;
  };
  let food = spawnFood();

  function nextDir() {
    const key = (x, y) => y * COLS + x;
    const bodySet = new Set(snake.slice(0, -1).map((s) => key(s.x, s.y)));
    const parent = new Map();
    const visited = new Set([key(snake[0].x, snake[0].y)]);
    const queue = [snake[0]];
    let found = null;
    while (queue.length) {
      const cur = queue.shift();
      if (cur.x === food.x && cur.y === food.y) { found = cur; break; }
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = cur.x + dx, ny = cur.y + dy;
        if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) continue;
        const k = key(nx, ny);
        if (visited.has(k) || bodySet.has(k)) continue;
        visited.add(k); parent.set(k, cur); queue.push({ x: nx, y: ny });
      }
    }
    if (!found) return null;
    let cur = found;
    while (parent.get(key(cur.x, cur.y)) && parent.get(key(cur.x, cur.y)) !== snake[0]) cur = parent.get(key(cur.x, cur.y));
    return { x: cur.x - snake[0].x, y: cur.y - snake[0].y };
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#ff5c7a";
    ctx.fillRect(food.x * CELL + 1, food.y * CELL + 1, CELL - 2, CELL - 2);
    snake.forEach((s, i) => { ctx.fillStyle = i === 0 ? "#39ff9c" : "#4ce7b4"; ctx.fillRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2); });
  }

  return {
    step() {
      tick++;
      if (tick % 5 !== 0) { draw(); return false; }
      if (dead) { draw(); return true; }
      const nd = nextDir();
      if (nd) dir = nd;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
      const hitWall = head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS;
      const hitSelf = snake.some((s) => s.x === head.x && s.y === head.y);
      if (hitWall || hitSelf || !nd) { dead = true; draw(); return true; }
      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) { if (snake.length >= COLS * ROWS - 2) dead = true; else food = spawnFood(); }
      else snake.pop();
      steps++;
      if (steps > 500) dead = true;
      draw();
      return false;
    },
  };
}

function boidsEngine(canvas, ctx) {
  const boids = Array.from({ length: 14 }, () => ({
    x: Math.random() * canvas.width, y: Math.random() * canvas.height,
    vx: (Math.random() - 0.5) * 1.5, vy: (Math.random() - 0.5) * 1.5,
  }));
  return {
    step() {
      for (const b of boids) {
        let sepX = 0, sepY = 0, aliX = 0, aliY = 0, cohX = 0, cohY = 0, n = 0;
        for (const o of boids) {
          if (o === b) continue;
          const dx = o.x - b.x, dy = o.y - b.y, d = Math.hypot(dx, dy);
          if (d < 20 && d > 0) { sepX -= dx / d; sepY -= dy / d; }
          if (d < 38) { aliX += o.vx; aliY += o.vy; cohX += o.x; cohY += o.y; n++; }
        }
        if (n > 0) {
          aliX /= n; aliY /= n; cohX = cohX / n - b.x; cohY = cohY / n - b.y;
          b.vx += sepX * 0.045 + aliX * 0.02 + cohX * 0.0012;
          b.vy += sepY * 0.045 + aliY * 0.02 + cohY * 0.0012;
        }
        const sp = Math.hypot(b.vx, b.vy), maxSp = 1.7;
        if (sp > maxSp) { b.vx = (b.vx / sp) * maxSp; b.vy = (b.vy / sp) * maxSp; }
        b.x += b.vx; b.y += b.vy;
        if (b.x < 0) b.x += canvas.width; if (b.x > canvas.width) b.x -= canvas.width;
        if (b.y < 0) b.y += canvas.height; if (b.y > canvas.height) b.y -= canvas.height;
      }
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#4ce7b4";
      for (const b of boids) {
        const ang = Math.atan2(b.vy, b.vx);
        ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(ang);
        ctx.beginPath(); ctx.moveTo(4.5, 0); ctx.lineTo(-3, 2.6); ctx.lineTo(-3, -2.6); ctx.closePath(); ctx.fill();
        ctx.restore();
      }
      return false;
    },
  };
}

function voronoiEngine(canvas, ctx) {
  const colors = ["#4ce7b4", "#ffb454", "#7ac1ff", "#ff5c7a", "#c792ea", "#39ff9c"];
  const seeds = Array.from({ length: 6 }, (_, i) => ({
    x: Math.random() * canvas.width, y: Math.random() * canvas.height,
    vx: (Math.random() - 0.5) * 0.55, vy: (Math.random() - 0.5) * 0.55, color: colors[i],
  }));
  const RES = 6;
  return {
    step() {
      for (const s of seeds) {
        s.x += s.vx; s.y += s.vy;
        if (s.x < 0 || s.x > canvas.width) s.vx *= -1;
        if (s.y < 0 || s.y > canvas.height) s.vy *= -1;
      }
      for (let py = 0; py < canvas.height; py += RES) {
        for (let px = 0; px < canvas.width; px += RES) {
          let best = 0, bd = Infinity;
          for (let i = 0; i < seeds.length; i++) {
            const dx = px - seeds[i].x, dy = py - seeds[i].y, d = dx * dx + dy * dy;
            if (d < bd) { bd = d; best = i; }
          }
          ctx.fillStyle = seeds[best].color; ctx.globalAlpha = 0.5;
          ctx.fillRect(px, py, RES, RES);
        }
      }
      ctx.globalAlpha = 1;
      for (const s of seeds) { ctx.fillStyle = s.color; ctx.beginPath(); ctx.arc(s.x, s.y, 2, 0, Math.PI * 2); ctx.fill(); }
      return false;
    },
  };
}

function conwayEngine(canvas, ctx) {
  const COLS = 28, ROWS = 20, CELL = canvas.width / COLS;
  let grid = Array.from({ length: ROWS }, () => Array.from({ length: COLS }, () => (Math.random() < 0.3 ? 1 : 0)));
  let gen = 0, tick = 0;
  const history = [];

  const countNeighbors = (x, y) => {
    let c = 0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      if (dx === 0 && dy === 0) continue;
      const nx = x + dx, ny = y + dy;
      if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS && grid[ny][nx]) c++;
    }
    return c;
  };

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#4ce7b4";
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (grid[y][x]) ctx.fillRect(x * CELL, y * CELL, CELL - 1, CELL - 1);
  }

  return {
    step() {
      tick++;
      if (tick % 4 !== 0) { draw(); return false; }
      const next = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
      let alive = 0;
      for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
        const n = countNeighbors(x, y), a = grid[y][x];
        next[y][x] = a ? (n === 2 || n === 3 ? 1 : 0) : (n === 3 ? 1 : 0);
        if (next[y][x]) alive++;
      }
      grid = next; gen++;
      const sig = grid.map((r) => r.join("")).join("|");
      history.push(sig); if (history.length > 6) history.shift();
      draw();
      const extinct = alive === 0;
      const stable = history.length >= 4 && history[history.length - 1] === history[history.length - 3];
      return extinct || stable || gen > 140;
    },
  };
}

function sortingEngine(canvas, ctx) {
  const N = 22, barW = canvas.width / N;
  const arr = Array.from({ length: N }, () => 0.08 + Math.random() * 0.88);
  let i = 0, j = 0, sorted = false;

  function draw(hi1, hi2) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let k = 0; k < N; k++) {
      const h = arr[k] * canvas.height * 0.92;
      ctx.fillStyle = k === hi1 || k === hi2 ? "#ffb454" : sorted ? "#39ff9c" : "#4ce7b4";
      ctx.fillRect(k * barW + 1, canvas.height - h, barW - 2, h);
    }
  }

  return {
    step() {
      if (sorted) return true;
      let swaps = 0;
      while (swaps < 2 && i < N - 1) {
        if (j < N - 1 - i) {
          if (arr[j] > arr[j + 1]) { [arr[j], arr[j + 1]] = [arr[j + 1], arr[j]]; swaps++; }
          j++;
        } else { j = 0; i++; }
      }
      if (i >= N - 1) sorted = true;
      draw(j, j + 1);
      return sorted;
    },
  };
}

function mandelbrotEngine(canvas, ctx) {
  const W = 70, H = 50;
  canvas.width = W; canvas.height = H;
  const centerX = -0.7436438870371587, centerY = 0.13182590420533;
  let scale = 3.2, frame = 0;

  const palette = (t) => [Math.floor(9 * (1 - t) * t * t * t * 255), Math.floor(15 * (1 - t) * (1 - t) * t * t * 255), Math.floor(8.5 * (1 - t) * (1 - t) * (1 - t) * t * 255)];

  function render(maxIter) {
    const img = ctx.createImageData(W, H);
    for (let py = 0; py < H; py++) for (let px = 0; px < W; px++) {
      const cx = centerX + (px / W - 0.5) * scale;
      const cy = centerY + (py / H - 0.5) * scale * (H / W);
      let zr = 0, zi = 0, it = 0;
      while (zr * zr + zi * zi <= 4 && it < maxIter) { const nzr = zr * zr - zi * zi + cx; zi = 2 * zr * zi + cy; zr = nzr; it++; }
      const idx = (py * W + px) * 4;
      if (it === maxIter) { img.data[idx] = 6; img.data[idx + 1] = 8; img.data[idx + 2] = 14; }
      else { const [r, g, b] = palette(it / maxIter); img.data[idx] = r; img.data[idx + 1] = g; img.data[idx + 2] = b; }
      img.data[idx + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
  }

  return {
    step() {
      frame++;
      render(Math.min(160, 40 + frame * 2));
      scale *= 0.955;
      return scale < 0.0015 || frame > 90;
    },
  };
}

/* Runs one engine on its own canvas, forever: draw frames via
   requestAnimationFrame, and whenever step() reports the run is over,
   freeze that last frame for 3s, then spin up a brand-new instance so
   walls/seeds/arrays/boards are re-randomized each cycle. */
function AlgoPreview({ engine, label }) {
  const canvasRef = useRef(null);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    let raf, pauseUntil = 0, current = engine(canvas, ctx);

    function frame(t) {
      if (t < pauseUntil) { raf = requestAnimationFrame(frame); return; }
      const done = current.step(t);
      if (done) { pauseUntil = t + 3000; current = engine(canvas, ctx); }
      raf = requestAnimationFrame(frame);
    }
    raf = requestAnimationFrame(frame);
    return () => cancelAnimationFrame(raf);
  }, [engine]);

  return (
    <div className="ap-gallery-slot ap-gallery-live">
      <canvas ref={canvasRef} width={140} height={100} className="ap-algo-canvas" />
      <span>{label}</span>
    </div>
  );
}

// Scattered clickable music notes + a small staff with a drawn melody.
//Clicking a note plays its pitch via the Web Audio API (do-re-mi...).
function MusicalBackground({ progress = 0 }) {
  const [ping, setPing] = useState(null);
  const [sparks, setSparks] = useState([]);
  const pingTimer = useRef(null);
  const lastAutoIndex = useRef(-1);
  const sparkId = useRef(0);

  const playTone = async (freq) => {
    try {
      const ctx = getAudioContext();
      if (!ctx) return;
      // Some browsers (Safari especially) need resume() to fully finish
      // before any node scheduled on the context will actually be heard —
      // starting the oscillator before that resolves can play silently.
      // In practice this context is already "running" by the time any note
      // fires, since it's unlocked once from the Press Start tap.
      if (ctx.state === "suspended") {
        await ctx.resume();
      }
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "triangle";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.18, ctx.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.55);
      osc.connect(gain).connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.6);
    } catch (e) {
      /* audio not available (or not yet unlocked by a user gesture) — fail silently */
    }
  };

  // Plays a note: pulses its color for a moment and bursts a few sparks
  // from its position. Used both for manual clicks and the automatic
  // sequence below.
  const triggerNote = useCallback((i) => {
    const n = NOTES[i];
    const pitch = SCALE[n.scale];
    playTone(pitch.freq);

    setPing(i);
    window.clearTimeout(pingTimer.current);
    pingTimer.current = window.setTimeout(() => setPing((p) => (p === i ? null : p)), 700);

    const id = ++sparkId.current;
    setSparks((prev) => [...prev, { id, top: n.top, left: n.left }]);
    window.setTimeout(() => {
      setSparks((prev) => prev.filter((s) => s.id !== id));
    }, 750);
  }, []);

  // Auto-play: as the page scrolls, walk through the notes one by one so a
  // different one lights up (color pulse + sparks) every little bit of
  // scroll progress — purely decorative, no click needed.
  useEffect(() => {
    const idx = Math.min(NOTES.length - 1, Math.floor(progress * NOTES.length));
    if (idx !== lastAutoIndex.current) {
      lastAutoIndex.current = idx;
      triggerNote(idx);
    }
  }, [progress, triggerNote]);

  return (
    <div className="ap-music-layer" aria-hidden="false">
      {NOTES.map((n, i) => {
        const pitch = SCALE[n.scale];
        return (
          <button
            key={i}
            className={`ap-note ${ping === i ? "is-pinged" : ""}`}
            style={{
              top: `${n.top}%`,
              left: `${n.left}%`,
              animationDuration: `${n.dur}s`,
              animationDelay: `${i * 0.4}s`,
            }}
            onClick={() => triggerNote(i)}
            aria-label={`Play note ${pitch.name}`}
            title={pitch.name}
          >
            <NoteGlyph type={n.type} size={n.size} />
            <span className="ap-note-label">{pitch.name}</span>
          </button>
        );
      })}

// Traveling border light. Instead of rotating a conic-gradient (which
//cuts across corners at an angle on non-square boxes), this traces an
// SVG outline shaped exactly like the card, so the light genuinely
// glides along the border to the right / clockwise. A few faded copies
// trail behind the bright leading dash to fake a comet tail that
// dissolves on the left as the head advances.
function GlowBorder({ radius = 16, className = "", style, children }) {
  const wrapRef = useRef(null);
  const [box, setBox] = useState({ w: 0, h: 0 });

  useEffect(() => {
    const el = wrapRef.current;
    if (!el) return;
    const update = () => setBox({ w: el.offsetWidth, h: el.offsetHeight });
    update();
    const ro = new ResizeObserver(update);
    ro.observe(el);
    return () => ro.disconnect();
  }, []);

  const { w, h } = box;
  const inset = 1;
  const rectW = Math.max(0, w - inset * 2);
  const rectH = Math.max(0, h - inset * 2);
  const r = Math.min(radius, rectW / 2, rectH / 2);
  const perimeter = 2 * (rectW + rectH) - 8 * r + 2 * Math.PI * r;
  const dash = Math.max(20, perimeter * 0.14);
  const gap = Math.max(0, perimeter - dash);
  const duration = Math.max(3.2, perimeter / 70);

  return (
    <div ref={wrapRef} className={`ap-glowb ${className}`} style={style}>
      {children}
      {w > 0 && h > 0 && (
        <svg className="ap-glowb-svg" width={w} height={h} viewBox={`0 0 ${w} ${h}`} aria-hidden="true">
          {[0, 1, 2, 3].map((i) => (
            <rect
              key={i}
              x={inset} y={inset} width={rectW} height={rectH} rx={r} ry={r}
              className="ap-glowb-trail"
              style={{
                strokeDasharray: `${dash} ${gap}`,
                "--peri": `${perimeter}px`,
                animationDuration: `${duration}s`,
                animationDelay: `${-(i * duration * 0.09)}s`,
                opacity: [1, 0.5, 0.26, 0.1][i],
              }}
            />
          ))}
        </svg>
      )}
    </div>
  );
}

/* ---- Small hand-rolled SVG chart primitives used by the trading section.
   No chart library is loaded (this is a single static file), so these just
   turn arrays of numbers into paths/rects against a computed scale. ---- */

function CandleChart({ candles, width = 560, height = 170 }) {
  const highs = candles.map((c) => c.h), lows = candles.map((c) => c.l);
  const max = Math.max(...highs), min = Math.min(...lows);
  const pad = (max - min) * 0.1 || 1;
  const yMax = max + pad, yMin = min - pad;
  const n = candles.length, slot = width / n, bodyW = slot * 0.52;
  const y = (v) => height - ((v - yMin) / (yMax - yMin)) * height;
  const closes = candles.map((c) => c.c);
  const ema = closes.map((_, i) => {
    const w = closes.slice(Math.max(0, i - 4), i + 1);
    return w.reduce((a, b) => a + b, 0) / w.length;
  });
  const emaPath = ema.map((v, i) => `${i === 0 ? "M" : "L"} ${i * slot + slot / 2} ${y(v)}`).join(" ");
  return (
    <svg viewBox={`0 0 ${width} ${height}`} width="100%" height={height} preserveAspectRatio="none">
      {candles.map((c, i) => {
        const cx = i * slot + slot / 2;
        const up = c.c >= c.o;
        const col = up ? "var(--shamrock)" : "#ff6b6b";
        const top = Math.min(y(c.o), y(c.c));
        return (
          <g key={i}>
            <line x1={cx} x2={cx} y1={y(c.h)} y2={y(c.l)} stroke={col} strokeWidth="1" opacity="0.85" />
            <rect x={cx - bodyW / 2} y={top} width={bodyW} height={Math.max(1.2, Math.abs(y(c.o) - y(c.c)))} fill={col} opacity="0.9" rx="1" />
          </g>
        );
      })}
      <path d={emaPath} fill="none" stroke="var(--amber)" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" opacity="0.9" />
    </svg>
  );
}

function IndicatorLine({ series, width = 560, height = 90, min, max, color = "var(--circuit)", bands = [], series2, color2 = "var(--amber)" }) {
  const all = series2 ? [...series, ...series2] : series;
  const vmin = min ?? Math.min(...all), vmax = max ?? Math.max(...all);
  const n = series.length, slot = width / (n - 1);
  const y = (v) => height - ((v - vmin) / (vmax - vmin || 1)) * height;
  const toPath = (arr) => arr.map((v, i) => `${i === 0 ? "M" : "L"} ${i * slot} ${y(v)}`).join(" ");
  return (
    <svg viewBox={`0 0 ${width} ${height}`} width="100%" height={height} preserveAspectRatio="none">
      {bands.map((b, i) => (
        <line key={i} x1="0" x2={width} y1={y(b)} y2={y(b)} stroke="var(--line)" strokeDasharray="4 4" strokeWidth="1" />
      ))}
      {series2 && <path d={toPath(series2)} fill="none" stroke={color2} strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round" opacity="0.85" />}
      <path d={toPath(series)} fill="none" stroke={color} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
}

function MacdChart({ macd, signal, width = 560, height = 90 }) {
  const hist = macd.map((v, i) => v - signal[i]);
  const all = [...macd, ...signal, ...hist];
  const vmax = Math.max(...all) + 0.4, vmin = Math.min(...all) - 0.4;
  const n = macd.length, slot = width / n;
  const y = (v) => height - ((v - vmin) / (vmax - vmin)) * height;
  const zero = y(0);
  const line = (arr, color) => (
    <path d={arr.map((v, i) => `${i === 0 ? "M" : "L"} ${i * slot + slot / 2} ${y(v)}`).join(" ")} fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" />
  );
  return (
    <svg viewBox={`0 0 ${width} ${height}`} width="100%" height={height} preserveAspectRatio="none">
      <line x1="0" x2={width} y1={zero} y2={zero} stroke="var(--line)" strokeWidth="1" />
      {hist.map((v, i) => {
        const up = v >= 0;
        const barH = Math.abs(y(v) - zero);
        return <rect key={i} x={i * slot + slot * 0.2} y={up ? y(v) : zero} width={slot * 0.6} height={Math.max(1, barH)} fill={up ? "var(--shamrock)" : "#ff6b6b"} opacity="0.7" />;
      })}
      {line(macd, "var(--circuit)")}
      {line(signal, "var(--amber)")}
    </svg>
  );
}

function BarChart({ data, width = 560, height = 70, color = "var(--circuit)" }) {
  const n = data.length, slot = width / n, max = Math.max(...data) || 1;
  return (
    <svg viewBox={`0 0 ${width} ${height}`} width="100%" height={height} preserveAspectRatio="none">
      {data.map((v, i) => {
        const h = (v / max) * height;
        return <rect key={i} x={i * slot + slot * 0.16} y={height - h} width={slot * 0.68} height={Math.max(1, h)} fill={color} opacity="0.75" rx="1" />;
      })}
    </svg>
  );
}

function DivergingBars({ data, width = 560, height = 70 }) {
  const n = data.length, slot = width / n;
  const max = Math.max(...data.map((d) => Math.max(d.l, d.s))) || 1;
  const mid = height / 2;
  return (
    <svg viewBox={`0 0 ${width} ${height}`} width="100%" height={height} preserveAspectRatio="none">
      <line x1="0" x2={width} y1={mid} y2={mid} stroke="var(--line)" strokeWidth="1" />
      {data.map((d, i) => {
        const hL = (d.l / max) * mid, hS = (d.s / max) * mid;
        return (
          <g key={i}>
            <rect x={i * slot + slot * 0.22} y={mid - hL} width={slot * 0.56} height={hL} fill="var(--shamrock)" opacity="0.85" />
            <rect x={i * slot + slot * 0.22} y={mid} width={slot * 0.56} height={hS} fill="#ff6b6b" opacity="0.85" />
          </g>
        );
      })}
    </svg>
  );
}

/* Ticking last-price badge — purely decorative, jitters around the last
   candle's close so the panel feels "live" without an actual feed. */
function LiveTicker({ base }) {
  const [price, setPrice] = useState(base);

      ${price.toFixed(2)}k
    </span>
  );
}

// Playable browser-canvas Snake — a quick homage to the Flutter original.
const SNAKE_GRID = 18;
const SNAKE_CELL = 15;

function SnakeGame() {
  const canvasRef = useRef(null);
  const stateRef = useRef(null);
  const timerRef = useRef(null);
  const [score, setScore] = useState(0);
  const [best, setBest] = useState(0);
  const [gameOver, setGameOver] = useState(false);
  const [started, setStarted] = useState(false);

  const randomApple = (snake) => {
    let pos;
    do {
      pos = {
        x: Math.floor(Math.random() * SNAKE_GRID),
        y: Math.floor(Math.random() * SNAKE_GRID),
      };
    } while (snake.some((s) => s.x === pos.x && s.y === pos.y));
    return pos;
  };

  const draw = useCallback(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const st = stateRef.current;
    ctx.fillStyle = "#12151c";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "rgba(243,239,230,0.04)";
    for (let i = 0; i < SNAKE_GRID; i++) {
      for (let j = 0; j < SNAKE_GRID; j++) {
        if ((i + j) % 2 === 0) ctx.fillRect(i * SNAKE_CELL, j * SNAKE_CELL, SNAKE_CELL, SNAKE_CELL);
      }
    }

    ctx.fillStyle = "#ffb454";
    ctx.beginPath();
    ctx.arc(
      st.apple.x * SNAKE_CELL + SNAKE_CELL / 2,
      st.apple.y * SNAKE_CELL + SNAKE_CELL / 2,
      SNAKE_CELL / 2.6, 0, Math.PI * 2
    );
    ctx.fill();

    st.snake.forEach((seg, i) => {
      ctx.fillStyle = i === 0 ? "#4ce7b4" : "#2fbf76";
      ctx.fillRect(seg.x * SNAKE_CELL + 1, seg.y * SNAKE_CELL + 1, SNAKE_CELL - 2, SNAKE_CELL - 2);
    });
  }, []);

  const resetGame = useCallback(() => {
    const snake = [{ x: 8, y: 9 }, { x: 7, y: 9 }, { x: 6, y: 9 }];
    stateRef.current = {
      snake,
      dir: { x: 1, y: 0 },
      nextDir: { x: 1, y: 0 },
      apple: randomApple(snake),
    };
    setScore(0);
    setGameOver(false);
    setStarted(true);
    draw();
  }, [draw]);

  const tick = useCallback(() => {
    const st = stateRef.current;
    if (!st) return;
    st.dir = st.nextDir;
    const head = { x: st.snake[0].x + st.dir.x, y: st.snake[0].y + st.dir.y };

    const hitWall = head.x < 0 || head.y < 0 || head.x >= SNAKE_GRID || head.y >= SNAKE_GRID;
    const hitSelf = st.snake.some((s) => s.x === head.x && s.y === head.y);

    if (hitWall || hitSelf) {
      clearInterval(timerRef.current);
      setGameOver(true);
      setBest((b) => Math.max(b, st.snake.length - 3));
      return;
    }

    st.snake.unshift(head);
    if (head.x === st.apple.x && head.y === st.apple.y) {
      st.apple = randomApple(st.snake);
      setScore((s) => s + 1);
    } else {
      st.snake.pop();
    }
    draw();
  }, [draw]);

  useEffect(() => {
    if (started && !gameOver) {
      timerRef.current = setInterval(tick, 130);
    }
    return () => clearInterval(timerRef.current);
  }, [started, gameOver, tick]);

  const setDirection = (dx, dy) => {
    const st = stateRef.current;
    if (!st) return;
    if (st.dir.x === -dx && st.dir.y === -dy) return;
    st.nextDir = { x: dx, y: dy };
  };

  const onKeyDown = (e) => {
    const map = {
      ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
      w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0],
    };
    if (map[e.key]) {
      e.preventDefault();
      if (!started || gameOver) resetGame();
      setDirection(map[e.key][0], map[e.key][1]);
    }
  };

  useEffect(() => {
    stateRef.current = {
      snake: [{ x: 8, y: 9 }, { x: 7, y: 9 }, { x: 6, y: 9 }],
      dir: { x: 1, y: 0 },
      nextDir: { x: 1, y: 0 },
      apple: { x: 13, y: 9 },
    };
    draw();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  return (
    <div className="ap-snake-wrap">
      <div
        className="ap-snake-board"
        tabIndex={0}
        onKeyDown={onKeyDown}
        onClick={() => { if (!started || gameOver) resetGame(); }}
      >
        <canvas
          ref={canvasRef}
          width={SNAKE_GRID * SNAKE_CELL}
          height={SNAKE_GRID * SNAKE_CELL}
          className="ap-snake-canvas"
        />
        {(!started || gameOver) && (
          <div className="ap-snake-overlay">
            <Play />
            <span>{gameOver ? "Game over — click to retry" : "Click or press an arrow key to play"}</span>
          </div>
        )}
      </div>
      <div className="ap-snake-side">
        <div className="ap-snake-score">
          <span>Score</span>
          <strong>{score}</strong>
        </div>
        <div className="ap-snake-score">
          <span>Best</span>
          <strong>{best}</strong>
        </div>
        <div className="ap-snake-pad" aria-hidden="true">
          <span />
          <button onClick={() => { if (!started || gameOver) resetGame(); setDirection(0, -1); }}><ArrowUp size={14} /></button>
          <span />
          <button onClick={() => { if (!started || gameOver) resetGame(); setDirection(-1, 0); }}><ArrowLeft size={14} /></button>
          <button onClick={resetGame}><RotateCcw size={13} /></button>
          <button onClick={() => { if (!started || gameOver) resetGame(); setDirection(1, 0); }}><ArrowRight size={14} /></button>
          <span />
          <button onClick={() => { if (!started || gameOver) resetGame(); setDirection(0, 1); }}><ArrowDown size={14} /></button>
          <span />
        </div>
        <p className="ap-snake-hint">Arrow keys or WASD. This browser build is a quick homage — the real thing is native Flutter.</p>
      </div>
    </div>
  );
}

/* Live BlastScript console — lexes, parses, type-checks and interprets
   real BlastScript source entirely client-side, using the same
   @blastscript/core the Next.js playground runs, compiled to a single
   browser bundle (see window.BlastScriptCore, injected in <head>). */
function BlastConsole() {
  const [exampleId, setExampleId] = useState(BLAST_EXAMPLES[0].id);
  const [code, setCode] = useState(BLAST_EXAMPLES[0].source);
  const [lines, setLines] = useState([]);
  const [typeErrors, setTypeErrors] = useState([]);
  const [status, setStatus] = useState("idle"); // idle | ok | error
  const [ranOnce, setRanOnce] = useState(false);

  const loadExample = (ex) => {
    setExampleId(ex.id);
    setCode(ex.source);
    setLines([]);
    setTypeErrors([]);
    setStatus("idle");
  };

  const runCode = () => {
    const core = window.BlastScriptCore;
    setRanOnce(true);
    if (!core) {
      setLines([{ kind: "error", text: "BlastScript core failed to load — check your connection and reload." }]);
      setTypeErrors([]);
      setStatus("error");
      return;
    }
    const out = [];
    try {
      const result = core.run(code, {
        onShout: (values) => out.push({ kind: "shout", text: values.map(String).join(" ") }),
        maxSteps: 150000,
      });
      setLines(out.length ? out : [{ kind: "muted", text: "(no shout() output — program ran fine, nothing was printed)" }]);
      setTypeErrors((result.typeErrors || []).map((e) => e.message));
      setStatus("ok");
    } catch (err) {
      setLines(out);
      setTypeErrors([]);
      setStatus("error");
      setLines((prev) => [...prev, { kind: "error", text: `${err.name || "Error"}: ${err.message || String(err)}` }]);
    }
  };

  return (
    <div className="ap-blast-wrap">
      <div className="ap-blast-examples">
        {BLAST_EXAMPLES.map((ex) => (
          <button
            key={ex.id}
            className={`ap-blast-example-btn ${exampleId === ex.id ? "is-active" : ""}`}
            onClick={() => loadExample(ex)}
          >
            {ex.label}
          </button>
        ))}
      </div>

      <div className="ap-blast-panes">
        <div className="ap-blast-pane">
          <div className="ap-blast-pane-label"><Code2 size={12} /> source.blast</div>
          <textarea
            className="ap-blast-editor"
            spellCheck={false}
            value={code}
            onChange={(e) => { setCode(e.target.value); setExampleId(null); }}
          />
        </div>
        <div className="ap-blast-pane">
          <div className="ap-blast-pane-label">
            <Terminal size={12} /> output
            {status !== "idle" && (
              <span className={`ap-blast-status ${status}`}>
                {status === "ok" ? <CheckCircle2 size={12} /> : <AlertTriangle size={12} />}
                {status === "ok" ? "ran" : "error"}
              </span>
            )}
          </div>
          <div className="ap-blast-output">
            {!ranOnce && <div className="ap-blast-line muted">Press Run to execute this program in your browser.</div>}
            {lines.map((l, i) => (
              <div className={`ap-blast-line ${l.kind}`} key={i}>
                {l.kind === "shout" ? <span className="ap-blast-prompt">&gt;</span> : null}
                {l.text}
              </div>
            ))}
            {typeErrors.length > 0 && (
              <div className="ap-blast-diagnostics">
                <div className="ap-blast-diagnostics-title"><AlertTriangle size={12} /> Type checker diagnostics</div>
                {typeErrors.map((t, i) => (
                  <div className="ap-blast-line warn" key={i}>{t}</div>
                ))}
              </div>
            )}
          </div>
        </div>
      </div>

      <div className="ap-blast-actions">
        <button className="ap-blast-run" onClick={runCode}><Play size={14} /> Run</button>
        <span className="ap-blast-hint">Runs fully client-side — nothing is sent to a server. Full language + Next.js playground on GitHub.</span>
      </div>
    </div>
  );
}
