/* ---------------------------------------------------------------------
   Scattered clickable music notes + a small staff with a drawn melody.
   Clicking a note plays its pitch via the Web Audio API (do-re-mi...).
   --------------------------------------------------------------------- */
function MusicalBackground({ progress = 0 }) {
  const ctxRef = useRef(null);
  const [ping, setPing] = useState(null);
  const [sparks, setSparks] = useState([]);
  const pingTimer = useRef(null);
  const lastAutoIndex = useRef(-1);
  const sparkId = useRef(0);

  const playTone = async (freq) => {
    try {
      if (!ctxRef.current) {
        const AC = window.AudioContext || window.webkitAudioContext;
        ctxRef.current = new AC();
      }
      const ctx = ctxRef.current;
      // Some browsers (Safari especially) need resume() to fully finish
      // before any node scheduled on the context will actually be heard —
      // starting the oscillator before that resolves can play silently.
      if (ctx.state === "suspended") {
        await ctx.resume();
      }
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "triangle";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.18, ctx.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.55);
      osc.connect(gain).connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.6);
    } catch (e) {
      /* audio not available (or not yet unlocked by a user gesture) — fail silently */
    }
  };

  // Plays a note: pulses its color for a moment and bursts a few sparks
  // from its position. Used both for manual clicks and the automatic
  // sequence below.
  const triggerNote = useCallback((i) => {
    const n = NOTES[i];
    const pitch = SCALE[n.scale];
    playTone(pitch.freq);

    setPing(i);
    window.clearTimeout(pingTimer.current);
    pingTimer.current = window.setTimeout(() => setPing((p) => (p === i ? null : p)), 700);

    const id = ++sparkId.current;
    setSparks((prev) => [...prev, { id, top: n.top, left: n.left }]);
    window.setTimeout(() => {
      setSparks((prev) => prev.filter((s) => s.id !== id));
    }, 750);
  }, []);

  // Auto-play: as the page scrolls, walk through the notes one by one so a
  // different one lights up (color pulse + sparks) every little bit of
  // scroll progress — purely decorative, no click needed.
  useEffect(() => {
    const idx = Math.min(NOTES.length - 1, Math.floor(progress * NOTES.length));
    if (idx !== lastAutoIndex.current) {
      lastAutoIndex.current = idx;
      triggerNote(idx);
    }
  }, [progress, triggerNote]);

  return (
    <div className="ap-music-layer" aria-hidden="false">
      {NOTES.map((n, i) => {
        const pitch = SCALE[n.scale];
        return (
          <button
            key={i}
            className={`ap-note ${ping === i ? "is-pinged" : ""}`}
            style={{
              top: `${n.top}%`,
              left: `${n.left}%`,
              animationDuration: `${n.dur}s`,
              animationDelay: `${i * 0.4}s`,
            }}
            onClick={() => triggerNote(i)}
            aria-label={`Play note ${pitch.name}`}
            title={pitch.name}
          >
            <NoteGlyph type={n.type} size={n.size} />
            <span className="ap-note-label">{pitch.name}</span>
          </button>
        );
      })}

      {sparks.map((s) => (
        <span key={s.id} className="ap-spark" style={{ top: `${s.top}%`, left: `${s.left}%` }}>
          {Array.from({ length: 6 }).map((_, k) => (
            <i key={k} style={{ "--a": `${k * 60}deg` }} />
          ))}
        </span>
      ))}

      {/* pentagram with a small hand-drawn melody */}
      <svg className="ap-staff" viewBox="0 0 640 90" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        {[0, 1, 2, 3, 4].map((i) => (
          <line key={i} x1="0" y1={14 + i * 14} x2="640" y2={14 + i * 14} stroke="currentColor" strokeWidth="1" />
        ))}
        {STAFF_MELODY.map((step, i) => {
          const x = 24 + i * 54;
          const y = 70 - step * 9;
          return (
            <g key={i}>
              {i > 0 && (
                <line
                  x1={x - 54 + 6} y1={70 - STAFF_MELODY[i - 1] * 9}
                  x2={x + 6} y2={y}
                  stroke="currentColor" strokeWidth="1.4" opacity="0.6"
                />
              )}
              <ellipse cx={x} cy={y} rx="6" ry="4.6" fill="currentColor" transform={`rotate(-14 ${x} ${y})`} />
              <rect x={x + 5.4} y={y - 26} width="1.6" height="26" fill="currentColor" />
            </g>
          );
        })}
      </svg>
    </div>
  );
}

/* ---------------------------------------------------------------------
   Traveling border light. Instead of rotating a conic-gradient (which
   cuts across corners at an angle on non-square boxes), this traces an
   SVG outline shaped exactly like the card, so the light genuinely
   glides along the border to the right / clockwise. A few faded copies
   trail behind the bright leading dash to fake a comet tail that
   dissolves on the left as the head advances.
   --------------------------------------------------------------------- */
function GlowBorder({ radius = 16, className = "", style, children }) {
  const wrapRef = useRef(null);
  const [box, setBox] = useState({ w: 0, h: 0 });

  useEffect(() => {
    const el = wrapRef.current;
    if (!el) return;
    const update = () => setBox({ w: el.offsetWidth, h: el.offsetHeight });
    update();
    const ro = new ResizeObserver(update);
    ro.observe(el);
    return () => ro.disconnect();
  }, []);

  const { w, h } = box;
  const inset = 1;
  const rectW = Math.max(0, w - inset * 2);
  const rectH = Math.max(0, h - inset * 2);
  const r = Math.min(radius, rectW / 2, rectH / 2);
  const perimeter = 2 * (rectW + rectH) - 8 * r + 2 * Math.PI * r;
  const dash = Math.max(20, perimeter * 0.14);
  const gap = Math.max(0, perimeter - dash);
  const duration = Math.max(3.2, perimeter / 70);

  return (
    <div ref={wrapRef} className={`ap-glowb ${className}`} style={style}>
      {children}
      {w > 0 && h > 0 && (
        <svg className="ap-glowb-svg" width={w} height={h} viewBox={`0 0 ${w} ${h}`} aria-hidden="true">
          {[0, 1, 2, 3].map((i) => (
            <rect
              key={i}
              x={inset} y={inset} width={rectW} height={rectH} rx={r} ry={r}
              className="ap-glowb-trail"
              style={{
                strokeDasharray: `${dash} ${gap}`,
                "--peri": `${perimeter}px`,
                animationDuration: `${duration}s`,
                animationDelay: `${-(i * duration * 0.09)}s`,
                opacity: [1, 0.5, 0.26, 0.1][i],
              }}
            />
          ))}
        </svg>
      )}
    </div>
  );
}

// Playable browser-canvas Snake — a quick homage to the Flutter original.
const SNAKE_GRID = 18;
const SNAKE_CELL = 15;

function SnakeGame() {
  const canvasRef = useRef(null);
  const stateRef = useRef(null);
  const timerRef = useRef(null);
  const [score, setScore] = useState(0);
  const [best, setBest] = useState(0);
  const [gameOver, setGameOver] = useState(false);
  const [started, setStarted] = useState(false);

  const randomApple = (snake) => {
    let pos;
    do {
      pos = {
        x: Math.floor(Math.random() * SNAKE_GRID),
        y: Math.floor(Math.random() * SNAKE_GRID),
      };
    } while (snake.some((s) => s.x === pos.x && s.y === pos.y));
    return pos;
  };

  const draw = useCallback(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const st = stateRef.current;
    ctx.fillStyle = "#12151c";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "rgba(243,239,230,0.04)";
    for (let i = 0; i < SNAKE_GRID; i++) {
      for (let j = 0; j < SNAKE_GRID; j++) {
        if ((i + j) % 2 === 0) ctx.fillRect(i * SNAKE_CELL, j * SNAKE_CELL, SNAKE_CELL, SNAKE_CELL);
      }
    }

    ctx.fillStyle = "#ffb454";
    ctx.beginPath();
    ctx.arc(
      st.apple.x * SNAKE_CELL + SNAKE_CELL / 2,
      st.apple.y * SNAKE_CELL + SNAKE_CELL / 2,
      SNAKE_CELL / 2.6, 0, Math.PI * 2
    );
    ctx.fill();

    st.snake.forEach((seg, i) => {
      ctx.fillStyle = i === 0 ? "#4ce7b4" : "#2fbf76";
      ctx.fillRect(seg.x * SNAKE_CELL + 1, seg.y * SNAKE_CELL + 1, SNAKE_CELL - 2, SNAKE_CELL - 2);
    });
  }, []);

  const resetGame = useCallback(() => {
    const snake = [{ x: 8, y: 9 }, { x: 7, y: 9 }, { x: 6, y: 9 }];
    stateRef.current = {
      snake,
      dir: { x: 1, y: 0 },
      nextDir: { x: 1, y: 0 },
      apple: randomApple(snake),
    };
    setScore(0);
    setGameOver(false);
    setStarted(true);
    draw();
  }, [draw]);

  const tick = useCallback(() => {
    const st = stateRef.current;
    if (!st) return;
    st.dir = st.nextDir;
    const head = { x: st.snake[0].x + st.dir.x, y: st.snake[0].y + st.dir.y };

    const hitWall = head.x < 0 || head.y < 0 || head.x >= SNAKE_GRID || head.y >= SNAKE_GRID;
    const hitSelf = st.snake.some((s) => s.x === head.x && s.y === head.y);

    if (hitWall || hitSelf) {
      clearInterval(timerRef.current);
      setGameOver(true);
      setBest((b) => Math.max(b, st.snake.length - 3));
      return;
    }

    st.snake.unshift(head);
    if (head.x === st.apple.x && head.y === st.apple.y) {
      st.apple = randomApple(st.snake);
      setScore((s) => s + 1);
    } else {
      st.snake.pop();
    }
    draw();
  }, [draw]);

  useEffect(() => {
    if (started && !gameOver) {
      timerRef.current = setInterval(tick, 130);
    }
    return () => clearInterval(timerRef.current);
  }, [started, gameOver, tick]);

  const setDirection = (dx, dy) => {
    const st = stateRef.current;
    if (!st) return;
    if (st.dir.x === -dx && st.dir.y === -dy) return;
    st.nextDir = { x: dx, y: dy };
  };

  const onKeyDown = (e) => {
    const map = {
      ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
      w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0],
    };
    if (map[e.key]) {
      e.preventDefault();
      if (!started || gameOver) resetGame();
      setDirection(map[e.key][0], map[e.key][1]);
    }
  };

  useEffect(() => {
    stateRef.current = {
      snake: [{ x: 8, y: 9 }, { x: 7, y: 9 }, { x: 6, y: 9 }],
      dir: { x: 1, y: 0 },
      nextDir: { x: 1, y: 0 },
      apple: { x: 13, y: 9 },
    };
    draw();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  return (
    <div className="ap-snake-wrap">
      <div
        className="ap-snake-board"
        tabIndex={0}
        onKeyDown={onKeyDown}
        onClick={() => { if (!started || gameOver) resetGame(); }}
      >
        <canvas
          ref={canvasRef}
          width={SNAKE_GRID * SNAKE_CELL}
          height={SNAKE_GRID * SNAKE_CELL}
          className="ap-snake-canvas"
        />
        {(!started || gameOver) && (
          <div className="ap-snake-overlay">
            <Play />
            <span>{gameOver ? "Game over — click to retry" : "Click or press an arrow key to play"}</span>
          </div>
        )}
      </div>
      <div className="ap-snake-side">
        <div className="ap-snake-score">
          <span>Score</span>
          <strong>{score}</strong>
        </div>
        <div className="ap-snake-score">
          <span>Best</span>
          <strong>{best}</strong>
        </div>
        <div className="ap-snake-pad" aria-hidden="true">
          <span />

          <button onClick={() => { if (!started || gameOver) resetGame(); setDirection(0, 1); }}><ArrowDown size={14} /></button>

        </div>
        <p className="ap-snake-hint">Arrow keys or WASD. This browser build is a quick homage — the real thing is native Flutter.</p>

}

function Portfolio() {

  const [displayed, setDisplayed] = useState([]);
  const [current, setCurrent] = useState("");
  const [progress, setProgress] = useState(0);
  const [active, setActive] = useState("hero");
  const [visited, setVisited] = useState(() => new Set());

  const sectionRefs = useRef({});
  const glowRef = useRef(null);

  // boot terminal typewriter
  useEffect(() => {
    let lineIdx = 0;
    let charIdx = 0;
    const interval = setInterval(() => {
      if (lineIdx >= BOOT_LINES.length) {
        clearInterval(interval);
        return;
      }
      const line = BOOT_LINES[lineIdx];
      charIdx += 1;
      setCurrent(line.slice(0, charIdx));
      if (charIdx >= line.length) {
        setDisplayed((prev) => [...prev, line]);
        setCurrent("");
        lineIdx += 1;
        charIdx = 0;
      }
    }, 20);
    return () => clearInterval(interval);
  }, []);

  // scroll progress (rAF throttled)
  useEffect(() => {
    let ticking = false;
    const onScroll = () => {
      if (ticking) return;
      ticking = true;
      window.requestAnimationFrame(() => {
        const scrollTop = window.scrollY;
        const docHeight = document.documentElement.scrollHeight - window.innerHeight;
        setProgress(docHeight > 0 ? Math.min(1, Math.max(0, scrollTop / docHeight)) : 0);
        ticking = false;
      });
    };
    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  // active section (scrollspy)
  useEffect(() => {
    const els = SECTIONS.map((s) => sectionRefs.current[s.id]).filter(Boolean);
    const obs = new IntersectionObserver(
      (entries) => {
        entries.forEach((e) => {
          if (e.isIntersecting) setActive(e.target.id);
        });
      },
      { rootMargin: "-42% 0px -50% 0px", threshold: 0 }
    );
    els.forEach((el) => obs.observe(el));
    return () => obs.disconnect();
  }, []);

    const obs = new IntersectionObserver(
      (entries) => {
        entries.forEach((e) => {

            setVisited((prev) => {
              if (prev.has(e.target.id)) return prev;
              const next = new Set(prev);
              next.add(e.target.id);
              return next;
            });

        });
      },
      { threshold: [0, 0.12, 0.4] }
    );
    els.forEach((el) => obs.observe(el));
    return () => obs.disconnect();
  }, []);

        .ap-badge-year { font-family: var(--font-mono); font-size: 10.5px; color: var(--ivory-dim); margin-top: 2px; }

        /* ---------- contact ---------- */
        .ap-contact-card {
          border: 1px solid var(--line); border-radius: 18px; padding: 44px 36px; text-align: center;

        @media (max-width: 640px) { .ap-contact-card { padding: 32px 20px; } }
        .ap-contact-card .ap-eyebrow { justify-content: center; }
        .ap-contact-card .ap-eyebrow::before { display: none; }
        .ap-contact-title { font-family: var(--font-display); font-weight: 700; font-size: clamp(26px, 4vw, 40px); margin: 0 0 16px; }
        .ap-contact-title em { font-family: var(--font-accent); font-style: italic; color: var(--shamrock); font-weight: 500; }
        .ap-contact-p { max-width: 520px; margin: 0 auto 32px; color: var(--ivory-dim); font-size: 15px; line-height: 1.8; }
        .ap-contact-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
        .ap-contact-btn {
          display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 13px;
          padding: 12px 20px; border-radius: 8px; border: 1px solid var(--line); color: var(--ivory);

        .ap-contact-btn:hover { border-color: var(--circuit); color: var(--circuit); transform: translateY(-2px); }

        .ap-contact-btn.primary { background: var(--circuit); color: var(--void); border-color: var(--circuit); font-weight: 700; }
        .ap-contact-btn.primary:hover { background: var(--ivory); border-color: var(--ivory); color: var(--void); }

        /* ---------- footer / piano strip ---------- */
        .ap-footer { padding: 0 24px 50px; max-width: 1080px; margin: 0 auto; }
        .ap-keys { display: flex; height: 46px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); margin-bottom: 22px; }
        .ap-key { flex: 1; background: var(--ebony-2); border-right: 1px solid var(--line); transition: transform 0.15s ease, background 0.15s ease; cursor: pointer; }
        .ap-key:hover { background: var(--circuit); transform: translateY(3px); }
        .ap-key:last-child { border-right: none; }
        .ap-footer-line { font-family: var(--font-mono); font-size: 12px; color: var(--ivory-dim); text-align: center; }
        .ap-footer-line svg { width: 12px; height: 12px; display: inline; vertical-align: -2px; margin: 0 4px; color: var(--circuit); }

        /* ---------- musical background ---------- */
        .ap-music-layer { position: fixed; inset: 0; z-index: 0; pointer-events: none; color: var(--ivory); }
        .ap-note {
          position: absolute; pointer-events: auto; background: none; border: none; cursor: pointer;
          color: var(--ivory-dim); opacity: 0.4; padding: 6px; display: flex; flex-direction: column; align-items: center; gap: 2px;
          animation: apNoteFloat ease-in-out infinite;
          transition: color 0.2s ease, opacity 0.2s ease, transform 0.2s ease;
        }
        .ap-note:hover { color: var(--amber); opacity: 0.95; transform: scale(1.15); }
        .ap-note.is-pinged { color: var(--circuit); opacity: 1; }
        .ap-note-label {
          font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.05em;
          opacity: 0; transition: opacity 0.2s ease;
        }
        .ap-note:hover .ap-note-label, .ap-note.is-pinged .ap-note-label { opacity: 0.85; }
        @keyframes apNoteFloat {
          0%, 100% { transform: translateY(0) rotate(-3deg); }
          50% { transform: translateY(-14px) rotate(3deg); }
        }
        .ap-staff {
          position: absolute; top: 6%; left: 50%; transform: translateX(-50%);
          width: min(640px, 82vw); height: auto; color: var(--ivory-dim); opacity: 0.16;
        }
        @media (max-width: 720px) { .ap-staff { display: none; } }

        /* ---------- note spark bursts ---------- */
        .ap-spark { position: absolute; width: 0; height: 0; pointer-events: none; }
        .ap-spark i {
          position: absolute; top: 0; left: 0; width: 4px; height: 4px; margin: -2px 0 0 -2px;
          border-radius: 50%; background: var(--circuit); box-shadow: 0 0 6px 1px var(--circuit);
          transform: rotate(var(--a)) translateX(0) scale(1); opacity: 1;
          animation: apSparkFly 0.75s cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
        }
        @keyframes apSparkFly {
          0% { transform: rotate(var(--a)) translateX(0) scale(1); opacity: 1; }
          100% { transform: rotate(var(--a)) translateX(24px) scale(0.2); opacity: 0; }
        }

        /* ---------- blockchain background ---------- */
        .ap-chain { position: fixed; z-index: 0; pointer-events: none; display: flex; align-items: center; opacity: 0.22; }
        .ap-block {
          width: 34px; height: 34px; border: 1.5px solid var(--circuit); border-radius: 6px;
          display: flex; flex-direction: column; justify-content: center; gap: 4px; padding: 6px;
          background: rgba(76,231,180,0.04);
        }
        .ap-block span { display: block; height: 2px; background: var(--circuit); opacity: 0.7; border-radius: 1px; }
        .ap-block span:last-child { width: 60%; }
        .ap-block-link { width: 18px; height: 1.5px; background: var(--circuit); }
        @media (max-width: 720px) { .ap-chain { display: none; } }

        /* ---------- snake game ---------- */
        .ap-snake-wrap { display: flex; gap: 22px; flex-wrap: wrap; align-items: flex-start; margin-top: 22px; }
        .ap-snake-board {
          position: relative; border-radius: 10px; overflow: hidden; border: 1px solid var(--line);
          outline: none; cursor: pointer; line-height: 0; flex-shrink: 0;
        }
        .ap-snake-board:focus-visible { border-color: var(--circuit); box-shadow: 0 0 0 3px rgba(76,231,180,0.25); }
        .ap-snake-canvas { display: block; image-rendering: pixelated; }
        .ap-snake-overlay {
          position: absolute; inset: 0; background: rgba(8,10,15,0.82); color: var(--ivory);
          display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
          font-family: var(--font-mono); font-size: 11.5px; text-align: center; padding: 16px;
        }
        .ap-snake-overlay svg { color: var(--circuit); width: 26px; height: 26px; }
        .ap-snake-side { flex: 1; min-width: 180px; display: flex; flex-direction: column; gap: 12px; }
        .ap-snake-score {
          display: flex; justify-content: space-between; align-items: baseline; font-family: var(--font-mono);
          border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; font-size: 12px; color: var(--ivory-dim);
        }
        .ap-snake-score strong { font-size: 18px; color: var(--circuit); font-family: var(--font-display); }
        .ap-snake-pad { display: grid; grid-template-columns: repeat(3, 34px); gap: 6px; }
        .ap-snake-pad button, .ap-snake-pad span { width: 34px; height: 34px; }
        .ap-snake-pad button {
          border: 1px solid var(--line); background: var(--ebony-2); color: var(--ivory-dim);
          border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .ap-snake-pad button:hover { border-color: var(--circuit); color: var(--circuit); }
        .ap-snake-hint { font-size: 12px; color: var(--ivory-dim); line-height: 1.6; margin: 4px 0 0; }

        @media (prefers-reduced-motion: reduce) {
          .ap-reveal, .ap-hero-inner, .ap-scroll-cue svg, .ap-particle, .ap-key, .ap-note, .ap-glowb-trail { animation: none !important; transition: none !important; }
        }
      `}</style>

          <div className="ap-about-grid">
            <div className={`ap-reveal d1 ${visited.has("about") ? "in-view" : ""}`}>

              <p className="ap-p">

                That range shows up in the work: object-oriented systems, game design in Unreal Engine, Linux server administration, AWS deployments, tokenized equity platforms, and permissioned EVM networks running on Besu.

                I'm looking for a place where technology, creativity and genuine craftsmanship meet — where I can help build things that matter, and that don't feel like anyone could have made them.

            <div className={`ap-reveal d2 ${visited.has("about") ? "in-view" : ""}`}>
              <div className="ap-stats-card">

                {ATTRIBUTES.map((a) => (
