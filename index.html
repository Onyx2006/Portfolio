 * All music is an original composition.*/

const PIANO_NOTES = [
  { name: "D4" },
  { name: "D#4" },
  { name: "E4" },
  { name: "F4" },
  { name: "F#4" },
  { name: "G4" },
  { name: "G#4" },
  { name: "A4" },
  { name: "A#4" },
  { name: "B4" },
  { name: "C5" },
  { name: "C#5" },
  { name: "D5" },
  { name: "D#5" },
  { name: "E5" },
  { name: "F5" },
  { name: "F#5" },
  { name: "G5" },
].map((n, i) => ({
  ...n,
  freq: 440 * Math.pow(2, (62 + i - 69) / 12),
}));


const PIANO_MELODY = [

  // INTRO — piano + very soft strings
  { notes: [0, 3, 7], dur: 900, chord: true },
  { notes: [2, 5, 10], dur: 700, chord: true },
  { notes: [3, 7, 12], dur: 1100, chord: true },

  // First movement
  { notes: [5, 8, 12], dur: 600, chord: true },
  { notes: [3, 7, 10], dur: 450, chord: true },
  { notes: [5, 8, 12], dur: 700, chord: true },
  { notes: [7, 10, 14], dur: 950, chord: true },

  // Faster movement
  { notes: [5, 8, 12], dur: 420, chord: true },
  { notes: [3, 7, 10], dur: 420, chord: true },
  { notes: [2, 5, 10], dur: 560, chord: true },
  { notes: [0, 3, 7, 12], dur: 900, chord: true },

  // Emotional section
  { notes: [7, 10, 14], dur: 650, chord: true },
  { notes: [5, 8, 12], dur: 480, chord: true },
  { notes: [3, 7, 10], dur: 780, chord: true },
  { notes: [0, 3, 7], dur: 1050, chord: true },

  // Rhythmic section
  { notes: [3, 7, 12], dur: 380, chord: true },
  { notes: [5, 8, 12], dur: 380, chord: true },
  { notes: [7, 10, 14], dur: 480, chord: true },
  { notes: [5, 8, 12, 15], dur: 680, chord: true },

  { notes: [3, 7, 10], dur: 330, chord: true },
  { notes: [5, 8, 12], dur: 330, chord: true },
  { notes: [7, 10, 14], dur: 430, chord: true },
  { notes: [10, 14, 17], dur: 780, chord: true },

  // Relaxation
  { notes: [7, 10, 14], dur: 650, chord: true },
  { notes: [5, 8, 12], dur: 600, chord: true },
  { notes: [3, 7, 10], dur: 820, chord: true },

  // Final descent
  { notes: [2, 5, 10], dur: 850, chord: true },
  { notes: [0, 3, 7], dur: 1050, chord: true },
  { notes: [3, 7, 10, 15], dur: 1250, chord: true },
  { notes: [5, 8, 12, 17], dur: 1450, chord: true },

  // Final chord
  { notes: [0, 3, 7, 12], dur: 2400, chord: true },
];


function PianoStrip() {

  const wrapRef = useRef(null);
  const timers = useRef([]);
  const hasPlayedRef = useRef(false);

  const [activeKeys, setActiveKeys] = useState(() => new Set());
  const [isPlaying, setIsPlaying] = useState(false);


  // AUDIO CONTEXT — shared with MusicalBackground; see getAudioContext().
  const getCtx = async () => {
    const ctx = getAudioContext();
    if (!ctx) return null;

    if (ctx.state === "suspended") {
      try {
        await ctx.resume();
      } catch (e) {
        // Browser requires user interaction
      }
    }

    return ctx;
  };


  // MASTER REVERB
  const createReverb = (ctx) => {
    const convolver = ctx.createConvolver();
    const length = ctx.sampleRate * 2.2;
    const impulse = ctx.createBuffer(
      2,
      length,
      ctx.sampleRate
    );

    for (let channel = 0; channel < 2; channel++) {
      const data = impulse.getChannelData(channel);
      for (let i = 0; i < length; i++) {
        data[i] =
          (Math.random() * 2 - 1) *
          Math.pow(1 - i / length, 2.5);
      }
    }

    convolver.buffer = impulse;
    return convolver;
  };


  // PIANO
  const playNote = useCallback(
    async (
      freq,
      {
        sustain = 1.5,
        gain = 0.06
      } = {}
    ) => {

      try {
        const ctx = await getCtx();
        const t0 = ctx.currentTime;
        const master = ctx.createGain();
        master.gain.setValueAtTime(
          0.0001,
          t0
        );

        master.gain.exponentialRampToValueAtTime(
          gain,
          t0 + 0.008
        );

        master.gain.exponentialRampToValueAtTime(
          gain * 0.5,
          t0 + 0.18
        );

        master.gain.exponentialRampToValueAtTime(
          gain * 0.18,
          t0 + sustain * 0.65
        );

        master.gain.exponentialRampToValueAtTime(
          0.0001,
          t0 + sustain
        );


        const filter =
          ctx.createBiquadFilter();

        filter.type = "lowpass";

        filter.frequency.setValueAtTime(
          Math.min(freq * 9, 8000),
          t0
        );

        filter.frequency.exponentialRampToValueAtTime(
          Math.min(freq * 3.5, 4000),
          t0 + sustain
        );

        filter.Q.value = 0.65;


        master.connect(filter);
        filter.connect(ctx.destination);


        /* Piano harmonics */
        const harmonics = [
          { ratio: 1, gain: 1.00 },
          { ratio: 2, gain: 0.28 },
          { ratio: 3, gain: 0.13 },
          { ratio: 4, gain: 0.055 },
          { ratio: 5, gain: 0.025 },
        ];


        harmonics.forEach(
          ({ ratio, gain: harmonicGain }) => {
            const osc =
              ctx.createOscillator();

            const g =
              ctx.createGain();

            osc.type = "sine";

            osc.frequency.setValueAtTime(
              freq * ratio,
              t0
            );


            g.gain.setValueAtTime(
              harmonicGain,
              t0
            );

            g.gain.exponentialRampToValueAtTime(
              Math.max(
                harmonicGain * 0.08,
                0.0001
              ),
              t0 + sustain * 0.7
            );

            osc.connect(g);
            g.connect(master);

            osc.start(t0);
            osc.stop(
              t0 + sustain + 0.1
            );
          }
        );


        /* Piano hammer */
        const attack =
          ctx.createOscillator();

        const attackGain =
          ctx.createGain();

        attack.type = "triangle";

        attack.frequency.value =
          freq * 2.7;

        attackGain.gain.setValueAtTime(
          0.018,
          t0
        );

        attackGain.gain.exponentialRampToValueAtTime(
          0.0001,
          t0 + 0.045
        );

        attack.connect(attackGain);
        attackGain.connect(master);

        attack.start(t0);
        attack.stop(t0 + 0.06);
      } catch (e) {
        // Audio unavailable
      }
    },
    []
  );


  // STRINGS
  const playStrings = useCallback(
    async (
      noteIndexes,
      {
        sustain = 1.5,
        gain = 0.025
      } = {}
    ) => {
      try {
        const ctx = await getCtx();
        const t0 = ctx.currentTime;
        const stringsBus =
          ctx.createGain();
        stringsBus.gain.setValueAtTime(
          0.0001,
          t0
        );

        /* Slow string attack */
        stringsBus.gain.exponentialRampToValueAtTime(
          gain,
          t0 + 0.28
        );

        stringsBus.gain.exponentialRampToValueAtTime(
          gain * 0.65,
          t0 + sustain * 0.65
        );

        stringsBus.gain.exponentialRampToValueAtTime(
          0.0001,
          t0 + sustain
        );

        const filter =
          ctx.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.value = 2500;
        filter.Q.value = 0.4;

        stringsBus.connect(filter);
        filter.connect(ctx.destination);

        noteIndexes.forEach(
          (index) => {
            const note =
              PIANO_NOTES[index];
            if (!note) return;

            /* Main string */
            const osc =
              ctx.createOscillator();

            const g =
              ctx.createGain();

            osc.type = "sawtooth";

            osc.frequency.value =
              note.freq;

            g.gain.value =
              0.07;

            osc.connect(g);
            g.connect(stringsBus);

            osc.start(t0);
            osc.stop(
              t0 + sustain + 0.15
            );

            /* Slight detuning */
            const osc2 =
              ctx.createOscillator();

            const g2 =
              ctx.createGain();

            osc2.type = "sawtooth";

            osc2.frequency.value =
              note.freq;

            osc2.detune.value = 6;

            g2.gain.value =
              0.045;

            osc2.connect(g2);
            g2.connect(stringsBus);

            osc2.start(t0 + 0.015);
            osc2.stop(
              t0 + sustain + 0.15
            );
          }
        );
      } catch (e) {
        // Strings unavailable
      }
    },
    []
  );


  // CELLO / LOW STRINGS
  const playCello = useCallback(
    async (
      noteIndexes,
      {
        sustain = 1.5,
        gain = 0.025
      } = {}
    ) => {

      try {
        const ctx = await getCtx();
        const t0 = ctx.currentTime;

        const lowest =
          PIANO_NOTES[noteIndexes[0]];

        if (!lowest) return;

        const celloBus =
          ctx.createGain();

        celloBus.gain.setValueAtTime(
          0.0001,
          t0
        );

        celloBus.gain.exponentialRampToValueAtTime(
          gain,
          t0 + 0.18
        );

        celloBus.gain.exponentialRampToValueAtTime(
          gain * 0.35,
          t0 + sustain * 0.7
        );

        celloBus.gain.exponentialRampToValueAtTime(
          0.0001,
          t0 + sustain
        );


        const filter =
          ctx.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.value = 900;

        celloBus.connect(filter);
        filter.connect(ctx.destination);

        const cello =
          ctx.createOscillator();

        const celloGain =
          ctx.createGain();

        cello.type = "triangle";

        /* One octave below */
        cello.frequency.value =
          lowest.freq / 2;

        celloGain.gain.value =
          0.45;

        cello.connect(celloGain);
        celloGain.connect(celloBus);

        cello.start(t0);
        cello.stop(
          t0 + sustain + 0.1
        );

      } catch (e) {
        // Cello unavailable
      }
    },
    []
  );


  // AMBIENT PAD
  const playPad = useCallback(
    async (
      noteIndexes,
      {
        sustain = 1.5,
        gain = 0.008
      } = {}
    ) => {

      try {
        const ctx = await getCtx();
        const t0 = ctx.currentTime;
        const pad =
          ctx.createGain();

        pad.gain.setValueAtTime(
          0.0001,
          t0
        );

        pad.gain.exponentialRampToValueAtTime(
          gain,
          t0 + 0.7
        );

        pad.gain.exponentialRampToValueAtTime(
          gain * 0.5,
          t0 + sustain * 0.75
        );

        pad.gain.exponentialRampToValueAtTime(
          0.0001,
          t0 + sustain
        );


        const filter =
          ctx.createBiquadFilter();

        filter.type = "lowpass";
        filter.frequency.value = 1200;

        pad.connect(filter);
        filter.connect(ctx.destination);


        noteIndexes.forEach(
          (index) => {

            const note =
              PIANO_NOTES[index];

            if (!note) return;

            const osc =
              ctx.createOscillator();


            const g =
              ctx.createGain();

            osc.type = "sine";

            osc.frequency.value =
              note.freq / 2;


            g.gain.value =
              0.18;

            osc.connect(g);
            g.connect(pad);

            osc.start(t0);
            osc.stop(
              t0 + sustain
            );
          }
        );

      } catch (e) {
        // Pad unavailable
      }
    },
    []
  );


  // ORCHESTRA CHORD
  const playOrchestraChord =
    useCallback(
      async (
        notes,
        {
          sustain = 1.3,
          intensity = 1
        } = {}
      ) => {

        /* Piano */
        notes.forEach(
          (index) => {

            const note =
              PIANO_NOTES[index];

            if (!note) return;

            playNote(
              note.freq,
              {
                sustain,
                gain:
                  0.045 * intensity
              }
            );
          }
        );

        /* Strings */
        playStrings(
          notes,
          {
            sustain:
              sustain + 0.15,

            gain:
              0.025 * intensity
          }
        );

        /* Cello */
        playCello(
          notes,
          {
            sustain:
              sustain + 0.1,

            gain:
              0.022 * intensity
          }
        );

        /* Ambient pad */
        playPad(
          notes,
          {
            sustain:
              sustain + 0.3,

            gain:
              0.007 * intensity
          }
        );
      },
      [
        playNote,
        playStrings,
        playCello,
        playPad
      ]
    );


  // KEY FLASH

  const flashKey = useCallback(
    (i, ms) => {

      setActiveKeys(
        (prev) =>
          new Set(prev).add(i)
      );


      const id =
        window.setTimeout(
          () => {

            setActiveKeys(
              (prev) => {

                if (!prev.has(i))
                  return prev;

                const next =
                  new Set(prev);

                next.delete(i);
                return next;
              }
            );
          },
          ms
        );

      timers.current.push(id);
    },
    []
  );


  // MANUAL PIANO

  const pressKey = useCallback(
    (i) => {

      const note =
        PIANO_NOTES[i];

      if (!note) return;

      playNote(
        note.freq,
        {
          sustain: 1.8,
          gain: 0.07
        }
      );

      flashKey(i, 260);
    },
    [
      playNote,
      flashKey
    ]
  );


  // PLAY ORCHESTRA

  const playMelody =
    useCallback(
      () => {

        timers.current.forEach(
          (id) =>
            window.clearTimeout(id)
        );

        timers.current = [];

        setIsPlaying(true);

        let elapsed = 0;


        PIANO_MELODY.forEach(
          (step, index) => {

            const id =
              window.setTimeout(
                () => {

                  const sustain =
                    (
                      step.dur +
                      (step.chord
                        ? 350
                        : 150)
                    ) / 1000;


                  /*
                   * Intensity evolves throughout
                   * the composition.
                   */

                  let intensity = 1;


                  if (index < 4) {
                    intensity = 0.72;
                  }

                  else if (
                    index >= 15 &&
                    index < 23
                  ) {
                    intensity = 0.9;
                  }

                  else if (
                    index >= 23
                  ) {
                    intensity = 0.82;
                  }


                  playOrchestraChord(
                    step.notes,
                    {
                      sustain,
                      intensity
                    }
                  );

                  /* Illuminate piano keys */

                  step.notes.forEach(
                    (i) => {
                      flashKey(
                        i,
                        Math.min(
                          step.dur + 100,
                          1000
                        )
                      );
                    }
                  );
                },
                elapsed
              );

            timers.current.push(id);

            elapsed += step.dur;
          }
        );


        const doneId =
          window.setTimeout(
            () =>
              setIsPlaying(false),
            elapsed + 600
          );

        timers.current.push(doneId);
      },
      [
        playOrchestraChord,
        flashKey
      ]
    );


  // AUTOPLAY WHEN SCROLLED INTO VIEW
  useEffect(() => {
    const el =
      wrapRef.current;
    if (!el) return;

    const obs =
      new IntersectionObserver(
        (entries) => {
          entries.forEach(
            (e) => {
              if (
                e.isIntersecting &&
                e.intersectionRatio > 0.4 &&
                !hasPlayedRef.current
              ) {
                hasPlayedRef.current =
                  true;

                const id =
                  window.setTimeout(
                    () =>
                      playMelody(),
                    300
                  );

                timers.current.push(id);
              }
            }
          );
        },
        {
          threshold: [0, 0.4]
        }
      );

    obs.observe(el);

    return () =>
      obs.disconnect();

  }, [playMelody]);

  useEffect(
    () =>
      () =>
        timers.current.forEach(
          (id) =>
            window.clearTimeout(id)
        ),
    []
  );

  return (
    <div
      className="ap-piano"
      ref={wrapRef}
    >
      <div className="ap-piano-head">
        <div className="ap-eyebrow">
          <Music2 size={13} />
          07 // PLAY IT YOURSELF
        </div>

        <button
          type="button"
          className="ap-piano-replay"
          onClick={playMelody}
          disabled={isPlaying}
        >

          <Play size={12} />

          {isPlaying
            ? "Ringing…"
            : "Repeat melody"}

        </button>
      </div>

      <div
        className="ap-keys"
        role="group"
        aria-label="Piano interactivo"
      >

        {PIANO_NOTES.map(
          (n, i) => (
            <button
              key={n.name}
              type="button"

              className={
                `ap-key ${
                  activeKeys.has(i)
                    ? "is-active"
                    : ""
                }`
              }

              onClick={() =>
                pressKey(i)
              }

              aria-label={
                `Nota ${n.name}`
              }
            >

              <span className="ap-key-label">
                {n.name.replace(/\d/, "")}
              </span>

            </button>
          )
        )}
      </div>
    </div>
  );
}

function Portfolio() {
  const [bootDone, setBootDone] = useState(false);
  const [displayed, setDisplayed] = useState([]);
  const [current, setCurrent] = useState("");
  const [progress, setProgress] = useState(0);
  const [active, setActive] = useState("hero");
  const [visited, setVisited] = useState(() => new Set());

  const sectionRefs = useRef({});
  const glowRef = useRef(null);

  // Lock scrolling until "Press Start" is hit — only the boot terminal
  // should be visible/interactive at first, the rest of the page (which is
  // already rendered below it) shouldn't be reachable by scrolling past it.
  useEffect(() => {
    const html = document.documentElement;
    const body = document.body;
    if (!bootDone) {
      const prevHtmlOverflow = html.style.overflow;
      const prevBodyOverflow = body.style.overflow;
      html.style.overflow = "hidden";
      body.style.overflow = "hidden";
      window.scrollTo(0, 0);
      return () => {
        html.style.overflow = prevHtmlOverflow;
        body.style.overflow = prevBodyOverflow;
      };
    }
  }, [bootDone]);

  // boot terminal typewriter
  useEffect(() => {
    let lineIdx = 0;
    let charIdx = 0;
    const interval = setInterval(() => {
      if (lineIdx >= BOOT_LINES.length) {
        clearInterval(interval);
        return;
      }
      const line = BOOT_LINES[lineIdx];
      charIdx += 1;
      setCurrent(line.slice(0, charIdx));
      if (charIdx >= line.length) {
        setDisplayed((prev) => [...prev, line]);
        setCurrent("");
        lineIdx += 1;
        charIdx = 0;
      }
    }, 20);
    return () => clearInterval(interval);
  }, []);

  // scroll progress (rAF throttled)
  useEffect(() => {
    let ticking = false;
    const onScroll = () => {
      if (ticking) return;
      ticking = true;
      window.requestAnimationFrame(() => {
        const scrollTop = window.scrollY;
        const docHeight = document.documentElement.scrollHeight - window.innerHeight;
        setProgress(docHeight > 0 ? Math.min(1, Math.max(0, scrollTop / docHeight)) : 0);
        ticking = false;
      });
    };
    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  // active section (scrollspy)
  useEffect(() => {
    const els = SECTIONS.map((s) => sectionRefs.current[s.id]).filter(Boolean);
    const obs = new IntersectionObserver(
      (entries) => {
        entries.forEach((e) => {
          if (e.isIntersecting) setActive(e.target.id);
        });
      },
      { rootMargin: "-42% 0px -50% 0px", threshold: 0 }
    );
    els.forEach((el) => obs.observe(el));
    return () => obs.disconnect();
  }, []);

  // reveal-on-scroll (visited sections get animation classes)
  useEffect(() => {
    const els = SECTIONS.map((s) => sectionRefs.current[s.id]).filter(Boolean);
    const obs = new IntersectionObserver(
      (entries) => {
        entries.forEach((e) => {
          if (e.isIntersecting && e.intersectionRatio > 0.12) {
            setVisited((prev) => {
              if (prev.has(e.target.id)) return prev;
              const next = new Set(prev);
              next.add(e.target.id);
              return next;
            });
          }
        });
      },
      { threshold: [0, 0.12, 0.4] }
    );
    els.forEach((el) => obs.observe(el));
    return () => obs.disconnect();
  }, []);

  const scrollTo = useCallback((id) => {
    sectionRefs.current[id]?.scrollIntoView({ behavior: "smooth", block: "start" });
  }, []);

  const setRef = (id) => (el) => {
    sectionRefs.current[id] = el;
  };

  const onMouseMove = (e) => {
    if (!glowRef.current) return;
    glowRef.current.style.setProperty("--mx", `${e.clientX}px`);
    glowRef.current.style.setProperty("--my", `${e.clientY}px`);
  };

  const railIndexTop = (i) => `${(i / (SECTIONS.length - 1)) * 100}%`;

  return (
    <div className="ap-root" onMouseMove={onMouseMove}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Fraunces:ital,wght@1,500;1,600&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap');

        .ap-root {
          --void: #080a0f;
          --ebony: #12151c;
          --ebony-2: #171b24;
          --ivory: #f3efe6;
          --ivory-dim: #a9b0bd;
          --circuit: #4ce7b4;
          --amber: #ffb454;
          --shamrock: #2fbf76;
          --violet: #9b8cff;
          --line: rgba(243,239,230,0.10);
          --font-display: 'Space Grotesk', sans-serif;
          --font-body: 'Inter', sans-serif;
          --font-mono: 'JetBrains Mono', monospace;
          --font-accent: 'Fraunces', serif;
          position: relative;
          background: var(--void);
          color: var(--ivory);
          font-family: var(--font-body);
          overflow-x: hidden;
          min-height: 100vh;
        }
        .ap-root * { box-sizing: border-box; }
        .ap-root ::selection { background: var(--circuit); color: var(--void); }

        /* ---------- ambient background ---------- */
        .ap-bg-grid {
          position: fixed; inset: 0; z-index: 0; pointer-events: none;
          background-image:
            linear-gradient(var(--line) 1px, transparent 1px),
            linear-gradient(90deg, var(--line) 1px, transparent 1px);
          background-size: 44px 44px;
          mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, black 40%, transparent 90%);
          opacity: 0.55;
        }
        .ap-bg-glow {
          position: fixed; inset: 0; z-index: 0; pointer-events: none;
          background: radial-gradient(600px circle at var(--mx, 50%) var(--my, 30%), rgba(76,231,180,0.06), transparent 60%);
        }
        .ap-particle {
          position: fixed; border-radius: 50%; background: var(--circuit);
          z-index: 0; pointer-events: none; opacity: 0.35;
          animation: apFloat linear infinite;
        }
        @keyframes apFloat {
          0% { transform: translateY(0) scale(1); opacity: 0.15; }
          50% { opacity: 0.5; }
          100% { transform: translateY(-40px) scale(1.2); opacity: 0.15; }
        }

        /* ---------- progress rail (desktop) ---------- */
        .ap-top-progress {
          position: fixed; top: 0; left: 0; height: 3px; z-index: 60;
          background: linear-gradient(90deg, var(--circuit), var(--amber));
          transition: width 0.1s linear;
        }
        .ap-rail {
          position: fixed; left: 28px; top: 0; bottom: 0; width: 140px;
          display: none; align-items: center; z-index: 50; pointer-events: none;
        }
        .ap-rail-track {
          position: relative; width: 2px; height: 62vh; margin-left: 5px;
          background: var(--line); border-radius: 2px; pointer-events: auto;
        }
        .ap-rail-fill {
          position: absolute; top: 0; left: 0; width: 100%;
          background: linear-gradient(180deg, var(--circuit), var(--shamrock));
          border-radius: 2px; transition: height 0.08s linear;
        }
        .ap-rail-avatar {
          position: absolute; left: 50%; width: 12px; height: 12px; margin-left: -6px; margin-top: -6px;
          background: var(--circuit); border-radius: 50%;
          box-shadow: 0 0 0 4px rgba(76,231,180,0.18), 0 0 16px 2px var(--circuit);
          transition: top 0.08s linear;
        }
        .ap-rail-node {
          position: absolute; left: -9px; margin-top: -10px; width: 20px; height: 20px;
          border-radius: 50%; background: var(--ebony); border: 2px solid var(--line);
          cursor: pointer; display: flex; align-items: center; justify-content: center;
          transition: all 0.25s ease; pointer-events: auto;
        }
        .ap-rail-node:hover { border-color: var(--amber); transform: scale(1.15); }
        .ap-rail-node.is-active { border-color: var(--circuit); background: var(--circuit); box-shadow: 0 0 12px var(--circuit); }
        .ap-rail-tip {
          position: absolute; left: 28px; top: 50%; transform: translateY(-50%);
          white-space: nowrap; font-family: var(--font-mono); font-size: 11px;
          background: var(--ebony); border: 1px solid var(--line); padding: 3px 8px; border-radius: 4px;
          opacity: 0; transition: opacity 0.2s ease; color: var(--ivory-dim);
        }
        .ap-rail-node:hover .ap-rail-tip, .ap-rail-node.is-active .ap-rail-tip { opacity: 1; color: var(--ivory); }
        @media (min-width: 1180px) { .ap-rail { display: flex; } }

        /* ---------- animated glow border (skills / projects / contact) ---------- */
        .ap-glowb { position: relative; }
        .ap-glowb-svg { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
        .ap-glowb-trail {
          fill: none;
          stroke: var(--circuit);
          stroke-width: 1.6;
          stroke-linecap: round;
          animation-name: apGlowTravel;
          animation-timing-function: linear;
          animation-iteration-count: infinite;
        }
        @keyframes apGlowTravel {
          from { stroke-dashoffset: 0; }
          to { stroke-dashoffset: calc(var(--peri) * -1); }
        }

        main { position: relative; z-index: 1; }
        section { position: relative; padding: 84px 24px; max-width: 1080px; margin: 0 auto; }
        @media (max-width: 640px) { section { padding: 60px 20px; } }

        .ap-eyebrow {
          font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.14em;
          color: var(--circuit); display: flex; align-items: center; gap: 8px; margin-bottom: 14px;
          text-transform: uppercase;
        }
        .ap-eyebrow::before { content: ''; width: 20px; height: 1px; background: var(--circuit); }
        .ap-h2 {
          font-family: var(--font-display); font-weight: 700; font-size: clamp(28px, 4vw, 44px);
          line-height: 1.1; margin: 0 0 28px; letter-spacing: -0.01em;
        }
        .ap-h2 em { font-family: var(--font-accent); font-style: italic; font-weight: 500; color: var(--amber); }

        .ap-reveal {
          opacity: 0; transform: translateY(28px); transition: opacity 0.7s ease, transform 0.7s ease;
        }
        .ap-reveal.in-view { opacity: 1; transform: translateY(0); }
        .ap-reveal.d1 { transition-delay: 0.08s; } .ap-reveal.d2 { transition-delay: 0.16s; }
        .ap-reveal.d3 { transition-delay: 0.24s; } .ap-reveal.d4 { transition-delay: 0.32s; }
        .ap-reveal.d5 { transition-delay: 0.40s; }

        /* ---------- hero ---------- */
        .ap-hero {
          display: flex; flex-direction: column; justify-content: center;
          padding-top: 72px; padding-bottom: 40px;
        }
        .ap-hero-inner { opacity: 0; transform: translateY(18px); transition: opacity 0.9s ease, transform 0.9s ease; }
        .ap-hero-inner.is-revealed { opacity: 1; transform: translateY(0); }
        .ap-kicker {
          font-family: var(--font-mono); font-size: 13px; color: var(--shamrock);
          display: inline-flex; align-items: center; gap: 8px; margin-bottom: 20px;
          border: 1px solid rgba(47,191,118,0.35); padding: 6px 12px; border-radius: 999px;
          background: rgba(47,191,118,0.08);
        }
        .ap-avatar-frame {
          width: 400px; height: 400px; border-radius: 26px; overflow: hidden;
          margin-bottom: 26px; background: var(--ebony-2);
        }
        .ap-avatar-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .ap-avatar-placeholder {
          width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center;
          justify-content: center; gap: 8px; color: var(--ivory-dim); text-align: center; padding: 10px;
        }
        .ap-avatar-placeholder svg { width: 24px; height: 24px; color: var(--circuit); opacity: 0.8; }
        .ap-avatar-placeholder span {
          font-family: var(--font-mono); font-size: 9.5px; line-height: 1.5; letter-spacing: 0.02em;
        }
        .ap-name {
          font-family: var(--font-display); font-weight: 700; letter-spacing: -0.02em;
          font-size: clamp(40px, 8vw, 84px); line-height: 1; margin: 0 0 18px;
        }
        .ap-role {
          font-family: var(--font-mono); font-size: clamp(14px, 2vw, 18px); color: var(--ivory-dim);
          margin: 0 0 34px; max-width: 640px;
        }
        .ap-hud { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 46px; }
        .ap-hud-chip {
          font-family: var(--font-mono); font-size: 12px; padding: 8px 14px; border-radius: 8px;
          border: 1px solid var(--line); background: rgba(255,255,255,0.02);
          display: flex; align-items: center; gap: 8px; color: var(--ivory-dim);
        }
        .ap-hud-chip svg { width: 14px; height: 14px; color: var(--circuit); }
        .ap-scroll-cue {
          display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 12px;
          color: var(--ivory-dim); cursor: pointer; background: none; border: none; padding: 0; width: fit-content;
        }
        .ap-scroll-cue svg { animation: apBounce 1.6s ease-in-out infinite; }
        @keyframes apBounce { 0%,100%{transform:translateY(0);} 50%{transform:translateY(6px);} }

        /* ---------- boot overlay ---------- */
        .ap-boot {
          position: fixed; inset: 0; z-index: 300; background: var(--void);
          display: flex; align-items: center; justify-content: center; padding: 24px;
          min-height: 100vh; min-height: 100dvh;
          transition: opacity 0.6s ease, visibility 0.6s;
        }
        .ap-boot.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .ap-boot-panel {
          width: 100%; max-width: 760px; border: 1px solid var(--line); border-radius: 14px;
          background: linear-gradient(180deg, var(--ebony), var(--void));
          box-shadow: 0 0 60px rgba(76,231,180,0.06), inset 0 0 40px rgba(0,0,0,0.4);
          padding: clamp(24px, 4vw, 40px) clamp(26px, 4.5vw, 44px) clamp(28px, 4.5vw, 40px);
          font-family: var(--font-mono);
        }
        .ap-boot-bar { display: flex; gap: 8px; margin-bottom: clamp(16px, 2.4vw, 22px); }
        .ap-boot-dot { width: 11px; height: 11px; border-radius: 50%; background: var(--line); }
        .ap-boot-lines { min-height: 220px; font-size: clamp(13.5px, 1.6vw, 17px); line-height: 2; color: var(--circuit); }
        .ap-boot-lines .done { color: var(--ivory-dim); }
        .ap-boot-cursor { display: inline-block; width: 8px; height: 16px; background: var(--circuit); margin-left: 2px; animation: apBlink 1s step-end infinite; vertical-align: -3px; }
        @keyframes apBlink { 50% { opacity: 0; } }
        .ap-start-btn {
          margin-top: clamp(18px, 2.6vw, 26px); width: 100%; font-family: var(--font-mono); font-weight: 700; letter-spacing: 0.08em;
          font-size: clamp(13px, 1.4vw, 16px); padding: clamp(14px, 1.8vw, 18px) 20px; border-radius: 8px; border: 1px solid var(--circuit);
          background: rgba(76,231,180,0.08); color: var(--circuit); cursor: pointer;
          display: flex; align-items: center; justify-content: center; gap: 10px;
          transition: background 0.2s ease, transform 0.15s ease; opacity: 0; transform: translateY(6px);
        }
        .ap-start-btn.is-ready { opacity: 1; transform: translateY(0); }
        .ap-start-btn:hover { background: rgba(76,231,180,0.18); transform: translateY(-1px); }

        /* ---------- about ---------- */
        .ap-about-grid { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 56px; align-items: start; }
        @media (max-width: 860px) { .ap-about-grid { grid-template-columns: 1fr; gap: 40px; } }
        .ap-lede { font-family: var(--font-accent); font-style: italic; font-size: clamp(19px, 2.4vw, 24px); color: var(--ivory); line-height: 1.5; margin-bottom: 18px; }
        .ap-p { font-size: 15.5px; line-height: 1.85; color: var(--ivory-dim); margin: 0 0 16px; }
        .ap-stats-card { border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; background: rgba(255,255,255,0.015); }
        .ap-stats-title { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; color: var(--amber); margin-bottom: 20px; text-transform: uppercase; }
        .ap-stat { margin-bottom: 16px; }
        .ap-stat:last-child { margin-bottom: 0; }
        .ap-stat-label { display: flex; justify-content: space-between; font-size: 12.5px; font-family: var(--font-mono); color: var(--ivory-dim); margin-bottom: 6px; }
        .ap-stat-track { height: 6px; border-radius: 4px; background: var(--line); overflow: hidden; }
        .ap-stat-fill { height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--circuit), var(--shamrock)); width: 0%; transition: width 1.1s cubic-bezier(.16,1,.3,1); }

        /* ---------- skills ---------- */
        .ap-skill-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; margin-bottom:1em}
        @media (max-width: 720px) { .ap-skill-grid { grid-template-columns: 1fr; } }
        .ap-skill-card { border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; background: rgba(255,255,255,0.015); transition: border-color 0.25s ease, transform 0.25s ease; }
        .ap-skill-card:hover { transform: translateY(-3px); }
        .ap-skill-head { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
        .ap-skill-head svg { width: 18px; height: 18px; }
        .ap-skill-head h3 { font-family: var(--font-display); font-size: 16px; margin: 0; font-weight: 600; }
        .ap-chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
        .ap-chip { font-family: var(--font-mono); font-size: 11.5px; padding: 6px 11px 6px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--ivory-dim); background: rgba(0,0,0,0.2); display: inline-flex; align-items: center; gap: 6px; transition: border-color 0.2s ease, transform 0.2s ease; }
        .ap-chip:hover { border-color: currentColor; transform: translateY(-1px); }
        .ap-chip-icon { display: inline-flex; opacity: 0.95; }
        .ap-chip-icon svg { display: block; }

        /* ---------- market ops / trading ---------- */
        .ap-ticker { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: rgba(0,0,0,0.25); transition: color 0.3s ease, border-color 0.3s ease; }
        .ap-ticker.up { color: var(--shamrock); border-color: rgba(47,191,118,0.35); }
        .ap-ticker.down { color: #ff6b6b; border-color: rgba(255,107,107,0.35); }
        .ap-indicator-note { font-size: 12.5px; line-height: 1.6; color: var(--ivory-dim); margin: 12px 0 0; }
        .ap-pipeline { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
        @media (max-width: 900px) { .ap-pipeline { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 520px) { .ap-pipeline { grid-template-columns: 1fr; } }
        .ap-pipeline-step { display: flex; gap: 12px; align-items: flex-start; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; background: rgba(255,255,255,0.015); }
        .ap-pipeline-icon { flex: none; width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--circuit); background: rgba(76,231,180,0.1); border: 1px solid rgba(76,231,180,0.25); }
        .ap-pipeline-title { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: 0.04em; color: var(--ivory); margin-bottom: 4px; }
        .ap-pipeline-text { font-size: 12.5px; line-height: 1.6; color: var(--ivory-dim); }

        /* ---------- experience / quest log ---------- */
        .ap-quest-list { position: relative; padding-left: 26px; }
        .ap-quest-list::before { content: ''; position: absolute; left: 6px; top: 8px; bottom: 8px; width: 1px; background: var(--line); }
        .ap-quest { position: relative; margin-bottom: 40px; }
        .ap-quest:last-child { margin-bottom: 0; }
        .ap-quest::before {
          content: ''; position: absolute; left: -26px; top: 4px; width: 12px; height: 12px; border-radius: 50%;
          background: var(--void); border: 2px solid var(--circuit); box-shadow: 0 0 10px rgba(76,231,180,0.4);
        }
        .ap-quest-tag-done { font-family: var(--font-mono); font-size: 10.5px; color: var(--shamrock); letter-spacing: 0.1em; margin-bottom: 6px; display: block; text-transform: uppercase; }
        .ap-quest-title { font-family: var(--font-display); font-size: 19px; font-weight: 600; margin: 0 0 2px; }
        .ap-quest-meta { font-family: var(--font-mono); font-size: 12px; color: var(--ivory-dim); margin-bottom: 12px; }
        .ap-quest ul { margin: 0 0 14px; padding-left: 18px; }
        .ap-quest li { font-size: 14.5px; line-height: 1.75; color: var(--ivory-dim); margin-bottom: 4px; }
        .ap-tag-row { display: flex; flex-wrap: wrap; gap: 8px; }
        .ap-tag { font-family: var(--font-mono); font-size: 10.5px; padding: 4px 10px; border-radius: 6px; background: rgba(255,180,84,0.1); color: var(--amber); border: 1px solid rgba(255,180,84,0.25); }

        /* ---------- projects ---------- */
        .ap-project-card { border: 1px solid var(--line); border-radius: 16px; padding: 26px 28px; background: linear-gradient(160deg, rgba(76,231,180,0.04), rgba(255,255,255,0.01)); margin-bottom: 40px; }
        .ap-project-card:last-child { margin-bottom: 5; }
        .ap-project-kicker { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--amber); margin-bottom: 10px; }
        @media (max-width: 640px) { .ap-project-card { padding: 18px; } }
        .ap-project-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 14px; margin-bottom: 18px; }
        .ap-project-title { font-family: var(--font-display); font-weight: 700; font-size: clamp(22px, 3vw, 30px); margin: 0; }
        .ap-lock-badge { display: flex; align-items: center; gap: 7px; font-family: var(--font-mono); font-size: 11px; color: var(--ivory-dim); border: 1px solid var(--line); padding: 6px 12px; border-radius: 999px; white-space: nowrap; }
        .ap-lock-badge svg { width: 13px; height: 13px; color: var(--amber); }
        .ap-project-card .ap-p { max-width: 720px; }
        .ap-tech-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0 30px; }
        .ap-project-shot {
          display: block; width: 100%; border-radius: 12px; border: 1px solid var(--line);
          box-shadow: 0 20px 50px -20px rgba(0,0,0,0.6); margin: 4px 0 22px;
        }
        .ap-project-links-extra { display: flex; flex-wrap: wrap; gap: 10px; margin: -6px 0 18px; }
        .ap-gallery { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        @media (max-width: 760px) { .ap-gallery { grid-template-columns: repeat(2, 1fr); } }
        .ap-gallery-slot {
          aspect-ratio: 4 / 3; border: 1.5px dashed var(--line); border-radius: 10px;
          display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
          color: var(--ivory-dim); text-align: center; padding: 12px; transition: border-color 0.2s ease, color 0.2s ease;
        }
        .ap-gallery-slot:hover { border-color: var(--circuit); color: var(--circuit); }
        .ap-gallery-slot svg { width: 20px; height: 20px; opacity: 0.7; }
        .ap-gallery-slot span { font-family: var(--font-mono); font-size: 10.5px; line-height: 1.4; }
        .ap-gallery-live { padding: 8px; gap: 6px; }
        .ap-gallery-live:hover { border-color: var(--circuit); }
        .ap-algo-canvas {
          width: 100%; flex: 1; min-height: 0; border-radius: 6px; background: #0a0e14;
          image-rendering: pixelated; image-rendering: crisp-edges; display: block;
        }

        /* ---------- education ---------- */
        .ap-edu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; }
        @media (max-width: 860px) { .ap-edu-grid { grid-template-columns: 1fr; gap: 36px; } }
        .ap-edu-item { border-left: 2px solid var(--line); padding: 2px 0 20px 18px; position: relative; }
        .ap-edu-item::before { content: ''; position: absolute; left: -6px; top: 3px; width: 10px; height: 10px; border-radius: 50%; background: var(--ebony); border: 2px solid var(--ivory-dim); }
        .ap-edu-item.active::before { border-color: var(--circuit); background: var(--circuit); }
        .ap-edu-item.upcoming::before { border-color: var(--amber); background: var(--amber); }
        .ap-edu-item.delayed::before { border-color: var(--amber); background: transparent; border-style: dashed; }
        .ap-edu-status { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 4px; display: block; color: var(--ivory-dim); }
        .ap-edu-item.active .ap-edu-status { color: var(--circuit); }
        .ap-edu-item.upcoming .ap-edu-status { color: var(--amber); }
        .ap-edu-item.delayed .ap-edu-status { color: var(--amber); }
        .ap-edu-note { font-size: 12.5px; color: var(--ivory-dim); margin-top: 4px; font-style: italic; }
        .ap-edu-title { font-family: var(--font-display); font-weight: 600; font-size: 16.5px; margin: 0 0 3px; }
        .ap-edu-meta { font-family: var(--font-mono); font-size: 12px; color: var(--ivory-dim); }
        .ap-badge-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        @media (max-width: 500px) { .ap-badge-grid { grid-template-columns: 1fr; } }
        .ap-badge { display: flex; gap: 12px; align-items: flex-start; border: 1px solid var(--line); border-radius: 10px; padding: 14px; background: rgba(255,255,255,0.015); }
        .ap-badge svg { width: 17px; height: 17px; color: var(--amber); flex-shrink: 0; margin-top: 2px; }
        .ap-badge-title { font-size: 13px; font-weight: 500; line-height: 1.4; }
        .ap-badge-year { font-family: var(--font-mono); font-size: 10.5px; color: var(--ivory-dim); margin-top: 2px; }

        /* ---------- contact ---------- */
        .ap-contact-card {
          border: 1px solid var(--line); border-radius: 18px; padding: 44px 36px; text-align: center;
          background: radial-gradient(circle at 50% 0%, rgba(47,191,118,0.08), transparent 60%);
        }
        @media (max-width: 640px) { .ap-contact-card { padding: 32px 20px; } }
        .ap-contact-card .ap-eyebrow { justify-content: center; }
        .ap-contact-card .ap-eyebrow::before { display: none; }
        .ap-contact-title { font-family: var(--font-display); font-weight: 700; font-size: clamp(26px, 4vw, 40px); margin: 0 0 16px; }
        .ap-contact-title em { font-family: var(--font-accent); font-style: italic; color: var(--shamrock); font-weight: 500; }
        .ap-contact-p { max-width: 520px; margin: 0 auto 32px; color: var(--ivory-dim); font-size: 15px; line-height: 1.8; }
        .ap-contact-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
        .ap-contact-btn {
          display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 13px;
          padding: 12px 20px; border-radius: 8px; border: 1px solid var(--line); color: var(--ivory);
          text-decoration: none; transition: all 0.2s ease; background: rgba(255,255,255,0.02);
        }
        .ap-contact-btn:hover { border-color: var(--circuit); color: var(--circuit); transform: translateY(-2px); }
        .ap-contact-btn svg { width: 15px; height: 15px; }
        .ap-contact-btn.primary { background: var(--circuit); color: var(--void); border-color: var(--circuit); font-weight: 700; }
        .ap-contact-btn.primary:hover { background: var(--ivory); border-color: var(--ivory); color: var(--void); }

        /* ---------- footer / interactive piano strip ---------- */
        .ap-footer { padding: 0 24px 50px; max-width: 1080px; margin: 0 auto; }
        .ap-piano { margin-bottom: 22px; }
        .ap-piano-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
        .ap-piano-replay {
          display: inline-flex; align-items: center; gap: 6px; background: var(--ebony-2); border: 1px solid var(--line);
          color: var(--ivory-dim); font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em;
          padding: 6px 11px; border-radius: 6px; cursor: pointer; transition: border-color 0.15s ease, color 0.15s ease;
        }
        .ap-piano-replay svg { width: 12px; height: 12px; }

                </a>
              </div>
              <p className="ap-p">
                A dashboard I built purely to sharpen my mathematical logic and exhaustive-reasoning muscles: seven independent algorithm modules — pathfinding (BFS / A*), a neuroevolved Snake, flocking boids, Voronoi diagrams, Conway's Game of Life, a sonified sorting visualizer and a zoomable Mandelbrot fractal — all hand-implemented in vanilla JavaScript over raw Canvas2D, with zero external libraries.
              </p>
              <p className="ap-p" style={{ color: "var(--ivory-dim)", fontSize: "13.5px" }}>
                Below is a quick preview of every module included. Want to see how each algorithm actually works under the hood? The full source and the live playground are on GitHub.
              </p>
              <div className="ap-tech-row">
                {["JavaScript", "Canvas2D", "A* Search", "Genetic Algorithms", "Fractals", "Zero Dependencies"].map((t) => (
                  <span className="ap-tag" key={t}>{t}</span>
                ))}
              </div>
              <div className="ap-gallery">
                {ALGO_MODULES.map((m) => (
                  <AlgoPreview key={m.name} engine={m.engine} label={m.label} />
                ))}
              </div>
            </GlowBorder>
          </div>

          <div className={`ap-reveal d5 ${visited.has("projects") ? "in-view" : ""}`}>
            <GlowBorder radius={16} className="ap-project-card">
              <div className="ap-project-kicker">Power-up</div>
              <div className="ap-project-top">
                <h3 className="ap-project-title">VERTEX — Crypto Market Terminal</h3>
                <a className="ap-lock-badge" href={PROFILE.vertexGithub} target="_blank" rel="noreferrer" style={{ textDecoration: "none" }}>
                  <Github /> View on GitHub
                </a>
              </div>
              <div className="ap-project-links-extra">
                <a className="ap-lock-badge" href={PROFILE.vertexDemo} target="_blank" rel="noreferrer" style={{ textDecoration: "none" }}>
                  <ExternalLink /> View Live Demo
                </a>
              </div>
              <img className="ap-project-shot" src="vertex-screenshot.png" alt="Vertex crypto market terminal — candlestick chart with RSI and MACD panels" loading="lazy" />
              <p className="ap-p">
                Vertex is a crypto market terminal with a professional trading-desk look, built like TradingView from the ground up — the entire charting engine is hand-written vanilla JavaScript on top of raw Canvas2D, with zero third-party charting libraries.
              </p>
              <p className="ap-p">
                It renders real candlesticks in 5 swappable styles (Japanese candles, Heikin-Ashi, line, area, OHLC bars), plus technical indicators computed by hand — SMA, EMA, Bollinger Bands, RSI and MACD, each synced to a shared crosshair with live OHLC tooltips. Zoom, pan and per-axis scale dragging all work identically on mouse and touch.
              </p>
              <p className="ap-p" style={{ color: "var(--ivory-dim)", fontSize: "13.5px" }}>
                Live market data — a 100-asset watchlist with sparklines, search and sorting, across 5 timeframes — comes from the public CoinGecko API. No backend, no build step: three static files shipped straight to GitHub Pages.
              </p>
              <div className="ap-tech-row">
                {["JavaScript", "Canvas2D", "CoinGecko API", "Technical Indicators", "Touch & Pointer Events", "Zero Dependencies"].map((t) => (
                  <span className="ap-tag" key={t}>{t}</span>
                ))}
              </div>
            </GlowBorder>
          </div>
        </section>

        {/* EDUCATION */}
        <section id="education" ref={setRef("education")}>
          <div className={`ap-reveal ${visited.has("education") ? "in-view" : ""}`}>
            <div className="ap-eyebrow"><GraduationCap size={13} /> 05 // ACHIEVEMENTS</div>
            <h2 className="ap-h2">Unlocked <em>along the way</em></h2>
          </div>
          <div className="ap-edu-grid">
            <div className={`ap-reveal d1 ${visited.has("education") ? "in-view" : ""}`}>
              <div className="ap-stats-title" style={{ marginBottom: 18 }}>Education</div>
              {EDUCATION.map((e) => (
                <div className={`ap-edu-item ${e.status}`} key={e.title}>
                  <span className="ap-edu-status">{e.status === "upcoming" ? "Upcoming" : e.status === "active" ? "In progress" : e.status === "delayed" ? "Postponed" : "Completed"}</span>
                  <div className="ap-edu-title">{e.title}</div>
                  <div className="ap-edu-meta">{e.place} · {e.time}</div>
                  {e.note && <div className="ap-edu-note">{e.note}</div>}
                </div>
              ))}
            </div>
            <div className={`ap-reveal d2 ${visited.has("education") ? "in-view" : ""}`}>
              <div className="ap-stats-title" style={{ marginBottom: 18 }}>Certifications</div>
              <div className="ap-badge-grid">
                {BADGES.map((b) => {
                  const Icon = b.icon;
                  return (
                    <div className="ap-badge" key={b.title}>
                      <Icon />
                      <div>
                        <div className="ap-badge-title">{b.title}</div>
                        {b.year && <div className="ap-badge-year">{b.year}</div>}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        </section>

        {/* TRADING / MARKET OPS */}
        <section id="trading" ref={setRef("trading")}>
          <div className={`ap-reveal ${visited.has("trading") ? "in-view" : ""}`}>
            <div className="ap-eyebrow"><Activity size={13} /> 06 // MARKET OPS</div>
            <h2 className="ap-h2">Bots that trade <em>while I sleep</em></h2>
            <p className="ap-p" style={{ maxWidth: 720 }}>
              Outside of client work, I'm a full-blown markets addict — I build my own algorithmic trading bots for fun and for profit, wiring price feeds straight into strategy logic that decides, sizes and fires the trade on its own. Crypto, precious metals, indices, forex — if it has a chart, I've probably tried to automate it.
            </p>
          </div>

          <div className={`ap-reveal d1 ${visited.has("trading") ? "in-view" : ""}`}>
            <GlowBorder radius={16} className="ap-project-card">
              <div className="ap-project-top" style={{ marginBottom: 6 }}>
                <div>
                  <div className="ap-project-kicker">Simulated feed</div>
                  <h3 className="ap-project-title" style={{ fontSize: "clamp(18px,2.4vw,22px)" }}>BTC / USD — 1H</h3>
                </div>
                <LiveTicker base={CANDLE_CLOSES[CANDLE_CLOSES.length - 1]} />
              </div>
              <CandleChart candles={CANDLES} />
              <div className="ap-chip-row" style={{ marginTop: 18 }}>
                {MARKETS.map((m) => {
                  const Icon = m.icon;
                  return (
                    <span className="ap-chip" key={m.label}>
                      <span className="ap-chip-icon" style={{ color: "var(--circuit)" }}><Icon size={13} strokeWidth={1.6} /></span>
                      {m.label}
                    </span>
                  );
                })}
              </div>
            </GlowBorder>
          </div>

          <div className={`ap-reveal d2 ${visited.has("trading") ? "in-view" : ""}`}>
            <div className="ap-skill-grid">
              <GlowBorder radius={12} className="ap-skill-card">
                <div className="ap-skill-head"><LineChart style={{ color: "var(--circuit)" }} /><h3>MACD</h3></div>
                <MacdChart macd={MACD_LINE} signal={MACD_SIGNAL} height={80} />
                <p className="ap-indicator-note">Crossovers between the MACD and signal line trigger trend-following entries; the histogram sizes momentum.</p>
              </GlowBorder>

              <GlowBorder radius={12} className="ap-skill-card">
                <div className="ap-skill-head"><Activity style={{ color: "var(--amber)" }} /><h3>RSI</h3></div>
                <IndicatorLine series={RSI_SERIES} min={0} max={100} bands={[30, 70]} color="var(--amber)" height={80} />
                <p className="ap-indicator-note">Flags overbought / oversold zones so the bot fades exhausted moves instead of chasing them.</p>
              </GlowBorder>

              <GlowBorder radius={12} className="ap-skill-card">
                <div className="ap-skill-head"><Gauge style={{ color: "var(--shamrock)" }} /><h3>Stochastic</h3></div>
                <IndicatorLine series={STOCH_K} series2={STOCH_D} min={0} max={100} bands={[20, 80]} color="var(--shamrock)" color2="var(--ivory-dim)" height={80} />
                <p className="ap-indicator-note">%K / %D crosses inside the extreme bands confirm RSI signals before any order is placed.</p>
              </GlowBorder>

              <GlowBorder radius={12} className="ap-skill-card">
                <div className="ap-skill-head"><AlertTriangle style={{ color: "var(--circuit)" }} /><h3>Volume &amp; Liquidations</h3></div>
                <BarChart data={VOLUME} color="var(--circuit)" height={40} />
                <DivergingBars data={LIQUIDATIONS} height={44} />
                <p className="ap-indicator-note">Volume spikes plus long/short liquidation clusters (green/red) mark where forced flow is likely to snap the price back.</p>
              </GlowBorder>
            </div>
          </div>

          <div className={`ap-reveal d3 ${visited.has("trading") ? "in-view" : ""}`}>
            <div className="ap-pipeline">
              {BOT_PIPELINE.map((step, i) => {
                const Icon = step.icon;
                return (
                  <div className="ap-pipeline-step" key={step.title}>
                    <div className="ap-pipeline-icon"><Icon size={16} /></div>
                    <div>
                      <div className="ap-pipeline-title">{String(i + 1).padStart(2, "0")} · {step.title}</div>
                      <div className="ap-pipeline-text">{step.text}</div>
                    </div>
                  </div>
                );
              })}
            </div>
            <div className="ap-tech-row" style={{ marginTop: 22, marginBottom: 0 }}>
              {["Backtesting", "Position sizing", "Stop-loss automation", "Exchange APIs", "Python", "Risk management", "Telegram alerts"].map((t) => (
                <span className="ap-tag" key={t}>{t}</span>
              ))}
            </div>
          </div>
        </section>

        {/* CONTACT */}
        <section id="contact" ref={setRef("contact")}>
          <div className={`ap-reveal ${visited.has("contact") ? "in-view" : ""}`}>
            <GlowBorder radius={18} className="ap-contact-card">
              <div className="ap-eyebrow"><MapPin size={13} /> 07 // NEXT LEVEL</div>
              <h3 className="ap-contact-title">New map loading: <em>Where to next?</em></h3>
              <p className="ap-contact-p">
                I'm looking for a new chapter full of new places, new challenges and new experiences. I'm open to wherever the next opportunity takes me, as long as I can keep learning, building and growing as a developer.
              </p>
              <div className="ap-contact-row">
                <a className="ap-contact-btn primary" href={`mailto:${PROFILE.email}`}><Mail /> {PROFILE.email}</a>
                <a className="ap-contact-btn" href={PROFILE.github} target="_blank" rel="noreferrer"><Github /> GitHub</a>
                <a className="ap-contact-btn" href={PROFILE.linkedin} target="_blank" rel="noreferrer"><Linkedin /> LinkedIn</a>
              </div>
            </GlowBorder>
          </div>
        </section>

        <footer className="ap-footer">
          <PianoStrip />
          <div className="ap-footer-line">
            Built with React <Music2 /> composed in Marbella <GitBranch /> shipping to fantasy
          </div>
        </footer>
      </main>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<Portfolio />);

</script>
